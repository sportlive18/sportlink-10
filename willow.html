<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">
  <style>
    :root{
      --pk-yellow:#FFCB05;
      --pk-yellow-dark:#E6A800;
      --pk-yellow-light:#FFE066;
      --pk-red:#EE1515;
      --pk-red-dark:#C40D0D;
      --pk-blue:#3B4CCA;
      --pk-blue-dark:#2A3A99;
      --pk-dark:#2A2A2A;
      --pk-dark-soft:#4A4A4A;
      --pk-cream:#FEF7E0;
      --pk-cream-2:#FDF0C5;
      --pk-white:#FFFFFF;
      --pk-gray:#9A9A9A;
      --pk-ice:#6BCEFF;
      --pk-grass:#7AC74C;
      --pk-fire:#EE8130;
      --pk-electric:#F7D02C;
      --pk-shadow:rgba(42,42,42,0.18);
      --pk-shadow-hard:rgba(42,42,42,0.3);
      --display:'Fredoka','Comic Sans MS',sans-serif;
      --body:'Nunito',-apple-system,BlinkMacSystemFont,sans-serif;
    }

    *{margin:0;padding:0;box-sizing:border-box}
    html,body{
      width:100%;height:100%;overflow:hidden;
      font-family:var(--body);
      -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
      -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    }

    /* Body with pokeball pattern */
    body{
      background-color:var(--pk-cream);
      background-image:
        radial-gradient(circle at 25% 25%, rgba(238,21,21,0.04) 0%, transparent 30%),
        radial-gradient(circle at 75% 75%, rgba(59,76,202,0.04) 0%, transparent 30%),
        radial-gradient(circle at 50% 50%, rgba(255,203,5,0.08) 0%, transparent 60%);
    }

    /* ════════════════════════════════════════════
       POKEBALL CSS ART
    ════════════════════════════════════════════ */
    .pokeball{
      border-radius:50%;
      background:var(--pk-red);
      border:2.5px solid var(--pk-dark);
      position:relative;overflow:hidden;
      flex-shrink:0;
    }
    .pokeball::before{
      content:'';position:absolute;
      bottom:0;left:0;right:0;height:50%;
      background:var(--pk-white);
      border-top:2.5px solid var(--pk-dark);
    }
    .pokeball::after{
      content:'';position:absolute;
      top:50%;left:50%;
      transform:translate(-50%,-50%);
      width:42%;height:42%;
      background:var(--pk-white);
      border:2.5px solid var(--pk-dark);
      border-radius:50%;
      z-index:1;
      box-shadow:0 0 0 1.5px var(--pk-dark);
    }

    /* ════════════════════════════════════════════
       TELEGRAM BADGE
    ════════════════════════════════════════════ */
    #tgBadge{
      position:fixed;
      top:max(14px,env(safe-area-inset-top));
      left:max(14px,env(safe-area-inset-left));
      z-index:10001;
      display:inline-flex;align-items:center;gap:9px;
      padding:10px 18px 10px 14px;
      background:linear-gradient(135deg,var(--pk-yellow),var(--pk-yellow-light));
      color:var(--pk-dark);
      font-family:var(--display);
      font-size:15px;
      font-weight:700;
      letter-spacing:.5px;
      text-transform:uppercase;
      text-decoration:none;
      border-radius:12px;
      border:3px solid var(--pk-dark);
      box-shadow:
        4px 4px 0 var(--pk-dark),
        0 6px 24px rgba(255,203,5,0.5);
      transition:transform .15s ease,box-shadow .15s ease;
      -webkit-tap-highlight-color:transparent;
    }
    #tgBadge:hover{
      transform:translate(-2px,-2px);
      box-shadow:6px 6px 0 var(--pk-dark), 0 8px 28px rgba(255,203,5,0.7);
    }
    #tgBadge:active{
      transform:translate(3px,3px);
      box-shadow:1px 1px 0 var(--pk-dark);
    }
    #tgBadge svg{
      width:22px;height:22px;flex-shrink:0;
      fill:var(--pk-dark);
    }
    #tgBadge span{white-space:nowrap}

    /* ── OVERLAY (LOADING) ── */
    #overlay{
      position:fixed;inset:0;
      background:
        radial-gradient(circle at 50% 30%, var(--pk-cream-2) 0%, var(--pk-cream) 70%);
      z-index:9999;
      display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px;
    }
    #overlay .pokeball{
      width:72px;height:72px;
      border-width:4px;
      animation:pokeball-spin 1.6s cubic-bezier(.5,0,.5,1) infinite;
      box-shadow:
        0 10px 30px rgba(238,21,21,0.35),
        0 0 0 6px var(--pk-white),
        0 0 0 9px var(--pk-dark);
    }
    #overlay .pokeball::before,
    #overlay .pokeball::after{border-width:4px}
    @keyframes pokeball-spin{
      0%{transform:rotate(0deg) scale(1);}
      40%{transform:rotate(180deg) scale(1.1);}
      80%{transform:rotate(360deg) scale(1);}
      100%{transform:rotate(360deg) scale(1);}
    }
    #overlay p{
      color:var(--pk-dark);
      font-family:var(--display);
      font-size:16px;
      font-weight:600;
      letter-spacing:1px;
      text-transform:uppercase;
      text-align:center;
      padding:0 24px;
    }

    /* ── CHANNEL LIST ── */
    #channel-list{
      position:fixed;inset:0;
      background:
        radial-gradient(ellipse 90% 50% at 50% 0%, rgba(255,203,5,0.25) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(59,76,202,0.08) 0%, transparent 50%),
        var(--pk-cream);
      z-index:9998;
      display:none;flex-direction:column;overflow-y:auto;
      padding:0 0 max(24px,env(safe-area-inset-bottom));
    }

    /* ── HEADER (POKEDEX STYLE) ── */
    .sw-header{
      padding:max(80px,calc(env(safe-area-inset-top) + 66px)) 20px 22px;
      text-align:center;
      position:sticky;top:0;z-index:10;
      background:linear-gradient(180deg, rgba(254,247,224,1) 0%, rgba(254,247,224,1) 82%, rgba(254,247,224,0) 100%);
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    }
    .sw-brand-pill{
      display:inline-flex;align-items:center;gap:14px;
      padding:12px 24px 12px 16px;
      background:linear-gradient(135deg,var(--pk-yellow) 0%,var(--pk-yellow-light) 100%);
      border:3px solid var(--pk-dark);
      border-radius:50px;
      box-shadow:
        5px 5px 0 var(--pk-dark),
        0 8px 30px rgba(255,203,5,0.45);
      margin-bottom:10px;
      position:relative;
    }
    .sw-brand-pill::before{
      content:'';position:absolute;
      inset:-8px;
      border-radius:60px;
      background:radial-gradient(circle, rgba(255,203,5,0.3), transparent 70%);
      z-index:-1;
      animation:glow-pulse 3s ease-in-out infinite;
    }
    @keyframes glow-pulse{
      0%,100%{opacity:.6;transform:scale(1);}
      50%{opacity:1;transform:scale(1.05);}
    }
    .sw-brand-pill .pokeball{
      width:34px;height:34px;
      border-width:3px;
      animation:pokeball-idle 4s ease-in-out infinite;
    }
    .sw-brand-pill .pokeball::before,
    .sw-brand-pill .pokeball::after{border-width:3px}
    @keyframes pokeball-idle{
      0%,100%{transform:rotate(0deg);}
      25%{transform:rotate(-15deg);}
      75%{transform:rotate(15deg);}
    }
    .sw-brand-text{
      font-family:var(--display);
      font-size:26px;
      font-weight:700;
      letter-spacing:.5px;
      color:var(--pk-dark);
      text-transform:uppercase;
      line-height:1;
      text-shadow:2px 2px 0 var(--pk-white);
    }
    .sw-brand-text span{color:var(--pk-red)}
    .sw-sub{
      color:var(--pk-dark-soft);
      font-family:var(--body);
      font-size:10.5px;font-weight:800;
      letter-spacing:2.5px;
      text-transform:uppercase;
      margin-bottom:20px;margin-top:6px;
    }

    /* ── TABS (TYPE BADGES) ── */
    .sw-tabs{
      display:flex;gap:10px;justify-content:center;
      padding-bottom:4px;flex-wrap:wrap;
    }
    .sw-tab{
      display:inline-flex;align-items:center;gap:8px;
      padding:10px 18px;
      border-radius:50px;
      background:var(--pk-white);
      border:2.5px solid var(--pk-dark);
      color:var(--pk-dark-soft);
      font-family:var(--display);
      font-size:12px;font-weight:600;
      letter-spacing:.8px;
      text-transform:uppercase;
      cursor:pointer;
      transition:all .2s ease;
      user-select:none;-webkit-tap-highlight-color:transparent;
      box-shadow:2px 2px 0 var(--pk-dark);
    }
    .sw-tab:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--pk-dark);}
    .sw-tab:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--pk-dark);}
    .sw-tab .tab-icon{
      font-size:16px;line-height:1;display:inline-block;
      filter:drop-shadow(0 1px 2px rgba(0,0,0,.2));
    }
    .sw-tab .count{
      font-family:var(--body);
      font-size:11px;font-weight:900;
      background:rgba(42,42,42,.1);
      padding:2px 8px;border-radius:20px;
      color:var(--pk-dark);
      min-width:22px;text-align:center;
    }

    /* LIVE active - fire type */
    #tab-live.active{
      background:linear-gradient(135deg,var(--pk-fire) 0%, var(--pk-red) 100%);
      color:#fff;
      border-color:var(--pk-dark);
      box-shadow:3px 3px 0 var(--pk-dark), 0 4px 20px rgba(238,129,48,0.5);
    }
    #tab-live.active .count{background:rgba(255,255,255,.25);color:#fff}
    #tab-live .tab-icon{
      animation:fire-flicker 1.4s ease-in-out infinite;
    }
    @keyframes fire-flicker{
      0%,100%{transform:scale(1) rotate(-4deg);}
      50%{transform:scale(1.15) rotate(4deg);}
    }

    /* UPCOMING active - electric type */
    #tab-upcoming.active{
      background:linear-gradient(135deg,var(--pk-electric) 0%, var(--pk-yellow) 100%);
      color:var(--pk-dark);
      border-color:var(--pk-dark);
      box-shadow:3px 3px 0 var(--pk-dark), 0 4px 20px rgba(247,208,44,0.6);
    }
    #tab-upcoming.active .count{background:rgba(42,42,42,.15);color:var(--pk-dark)}
    #tab-upcoming .tab-icon{
      animation:zap-pulse 1.6s ease-in-out infinite;
    }
    @keyframes zap-pulse{
      0%,100%{opacity:1;transform:scale(1);}
      50%{opacity:.85;transform:scale(1.1);}
    }

    /* ── CARD GRID ── */
    #ch-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
      gap:18px;
      padding:0 16px;
    }

    #ch-grid:empty::after{
      content:'No matches in this category';
      display:block;
      grid-column:1 / -1;
      text-align:center;
      padding:64px 20px;
      color:var(--pk-dark-soft);
      font-family:var(--display);
      font-size:15px;font-weight:600;
      letter-spacing:1px;text-transform:uppercase;
      background:var(--pk-white);
      border:3px dashed var(--pk-dark);
      border-radius:16px;
    }

    /* ── MATCH CARD (POKEMON CARD STYLE) ── */
    .ch-card{
      background:linear-gradient(180deg,var(--pk-yellow) 0%, var(--pk-yellow-dark) 100%);
      border:3px solid var(--pk-dark);
      border-radius:18px;
      cursor:pointer;
      text-decoration:none;
      display:flex;flex-direction:column;
      overflow:hidden;
      position:relative;
      padding:5px;
      transition:transform .2s cubic-bezier(.4,0,.2,1),
                 box-shadow .2s;
      box-shadow:4px 4px 0 var(--pk-dark), 0 8px 24px rgba(0,0,0,.15);
      -webkit-tap-highlight-color:transparent;
    }
    .ch-card:hover{
      transform:translate(-2px,-2px);
      box-shadow:6px 6px 0 var(--pk-dark), 0 12px 32px rgba(0,0,0,.2);
    }
    .ch-card:active{
      transform:translate(3px,3px);
      box-shadow:1px 1px 0 var(--pk-dark);
    }

    /* card inner white area */
    .ch-card-inner{
      background:var(--pk-white);
      border-radius:14px;
      border:2px solid var(--pk-dark);
      display:flex;flex-direction:column;
      overflow:hidden;
      flex:1;
    }

    /* card header name plate */
    .card-header{
      display:flex;align-items:center;justify-content:space-between;
      gap:8px;
      padding:10px 12px;
      background:linear-gradient(180deg, rgba(255,203,5,.2) 0%, transparent 100%);
      border-bottom:2px solid var(--pk-dark);
    }
    .card-name{
      font-family:var(--display);
      font-size:13.5px;
      font-weight:600;
      color:var(--pk-dark);
      letter-spacing:.2px;
      line-height:1.2;
      display:-webkit-box;
      -webkit-line-clamp:1;
      -webkit-box-orient:vertical;
      overflow:hidden;
      flex:1;min-width:0;
    }
    .card-hp{
      display:inline-flex;align-items:center;gap:4px;
      font-family:var(--display);
      font-size:12px;
      font-weight:700;
      color:var(--pk-red);
      padding:2px 8px;
      background:var(--pk-white);
      border:1.5px solid var(--pk-dark);
      border-radius:6px;
      flex-shrink:0;
    }
    .card-hp::before{
      content:'';display:inline-block;
      width:8px;height:8px;border-radius:50%;
      background:var(--pk-red);
      box-shadow:0 0 0 1px var(--pk-dark);
    }

    /* image area */
    .ch-img{
      position:relative;width:100%;padding-top:56%;
      background:var(--pk-cream-2);
      overflow:hidden;
      margin:8px;
      border-radius:8px;
      border:2px solid var(--pk-dark);
      width:calc(100% - 16px);
    }
    .ch-img img{
      position:absolute;inset:0;width:100%;height:100%;
      object-fit:cover;
      transition:transform .4s ease;
    }
    .ch-card:hover .ch-img img{transform:scale(1.06)}
    .ch-img-placeholder{
      position:absolute;inset:0;
      display:flex;align-items:center;justify-content:center;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,203,5,.4) 0%, transparent 70%),
        linear-gradient(135deg,#FDF0C5 0%, #FFE066 100%);
      font-family:var(--display);
      font-size:36px;
      color:var(--pk-dark);
      letter-spacing:2px;
      font-weight:700;
      text-shadow:2px 2px 0 var(--pk-white);
    }

    /* status badges - pokemon type style */
    .ch-img-badge{
      position:absolute;top:8px;left:8px;z-index:2;
      font-family:var(--display);
      font-size:10px;font-weight:700;
      letter-spacing:.8px;text-transform:uppercase;
      padding:4px 10px;border-radius:20px;
      display:flex;align-items:center;gap:5px;
      border:2px solid var(--pk-dark);
      box-shadow:1.5px 1.5px 0 var(--pk-dark);
    }
    .ch-img-badge.live{
      background:linear-gradient(135deg,var(--pk-fire) 0%, var(--pk-red) 100%);
      color:#fff;
    }
    .ch-img-badge.live .b-dot{
      width:6px;height:6px;border-radius:50%;
      background:#fff;
      animation:live-pulse 1.2s ease-in-out infinite;
    }
    @keyframes live-pulse{
      0%,100%{opacity:1;transform:scale(1);}
      50%{opacity:.4;transform:scale(.7);}
    }
    .ch-img-badge.upcoming{
      background:linear-gradient(135deg,var(--pk-electric) 0%, var(--pk-yellow-light) 100%);
      color:var(--pk-dark);
    }
    .ch-img-badge.upcoming svg{
      width:12px;height:12px;
      stroke:var(--pk-dark);
      fill:none;stroke-width:2.5;flex-shrink:0;
    }

    /* free tag - item badge */
    .ch-free{
      position:absolute;top:8px;right:8px;z-index:2;
      background:linear-gradient(135deg,var(--pk-grass) 0%, #5DA93A 100%);
      color:#fff;
      font-family:var(--display);
      font-size:9px;font-weight:700;
      letter-spacing:1px;
      padding:4px 9px;border-radius:8px;
      text-transform:uppercase;
      border:2px solid var(--pk-dark);
      box-shadow:1.5px 1.5px 0 var(--pk-dark);
      text-shadow:1px 1px 0 rgba(0,0,0,.3);
    }

    /* time row */
    .card-time{
      display:flex;align-items:center;justify-content:center;gap:6px;
      color:var(--pk-dark-soft);
      font-family:var(--body);
      font-size:11px;font-weight:800;
      letter-spacing:.3px;
      padding:4px 12px 10px;
    }
    .card-time svg{
      width:13px;height:13px;
      stroke:var(--pk-red);fill:none;stroke-width:2.4;
      flex-shrink:0;
    }

    /* CTA - pokemon button */
    .ch-cta{
      margin:0 10px 10px;
      padding:11px;
      border-radius:10px;
      font-family:var(--display);
      font-size:12.5px;font-weight:700;
      letter-spacing:1.2px;
      text-transform:uppercase;
      text-align:center;
      display:flex;align-items:center;justify-content:center;gap:8px;
      border:2.5px solid var(--pk-dark);
      transition:all .15s ease;
    }
    .ch-cta.watch{
      background:linear-gradient(135deg,var(--pk-red) 0%, var(--pk-red-dark) 100%);
      color:#fff;
      box-shadow:3px 3px 0 var(--pk-dark);
      text-shadow:1.5px 1.5px 0 rgba(0,0,0,.35);
    }
    .ch-card:hover .ch-cta.watch{
      transform:translate(-1px,-1px);
      box-shadow:4px 4px 0 var(--pk-dark);
    }
    .ch-cta.watch .play-tri{
      width:0;height:0;
      border-top:5px solid transparent;
      border-bottom:5px solid transparent;
      border-left:8px solid #fff;
      display:inline-block;
      filter:drop-shadow(1px 1px 0 rgba(0,0,0,.35));
    }
    .ch-cta.not-live{
      background:var(--pk-cream-2);
      color:var(--pk-dark-soft);
      border-color:var(--pk-dark-soft);
      box-shadow:3px 3px 0 var(--pk-dark-soft);
    }
    .ch-cta.not-live svg{
      width:13px;height:13px;
      stroke:var(--pk-dark-soft);
      fill:none;stroke-width:2.4;
    }

    /* pokeball corner decoration */
    .ch-card::after{
      content:'';
      position:absolute;
      bottom:-16px;right:-16px;
      width:56px;height:56px;
      border-radius:50%;
      background:var(--pk-red);
      border:2.5px solid var(--pk-dark);
      opacity:.25;
      pointer-events:none;
      z-index:1;
    }
    .ch-card::before{
      content:'';
      position:absolute;
      bottom:-14px;right:14px;
      width:22px;height:22px;
      border-radius:50%;
      background:var(--pk-white);
      border:2.5px solid var(--pk-dark);
      opacity:.25;
      pointer-events:none;
      z-index:1;
    }

    /* ── PLAYER ── */
    #pc{
      position:fixed;inset:0;background:#000;display:none;
      align-items:center;justify-content:center;touch-action:manipulation;
    }
    video{width:100%;height:100%;object-fit:contain;background:#000;will-change:transform}
    video.mode-fill{object-fit:fill}
    video.mode-cover{object-fit:cover}

    /* ── STATUS TOAST (POKEMON DIALOG BOX) ── */
    #status{
      position:fixed;
      top:calc(max(14px,env(safe-area-inset-top)) + 68px);
      right:max(12px,env(safe-area-inset-right));
      z-index:9997;
      padding:10px 16px 10px 14px;
      background:var(--pk-white);
      border:3px solid var(--pk-dark);
      font-family:var(--display);
      font-size:12px;font-weight:600;
      letter-spacing:.5px;
      border-radius:10px;
      pointer-events:none;opacity:0;transition:opacity .3s;
      max-width:280px;text-align:right;
      box-shadow:
        3px 3px 0 var(--pk-dark),
        inset 0 -3px 0 rgba(0,0,0,0.06);
      color:var(--pk-dark);
    }
    #status.show{opacity:1}
    #status::after{
      content:'▼';
      position:absolute;
      bottom:-4px;right:14px;
      font-size:12px;
      color:var(--pk-dark);
      animation:bounce-arrow 1s ease-in-out infinite;
    }
    @keyframes bounce-arrow{
      0%,100%{transform:translateY(0);}
      50%{transform:translateY(3px);}
    }
    #status.ok{
      border-color:var(--pk-dark);
      background:linear-gradient(135deg,var(--pk-yellow-light),var(--pk-white));
    }
    #status.warn{
      border-color:var(--pk-dark);
      background:linear-gradient(135deg,var(--pk-electric),var(--pk-yellow-light));
    }
    #status.err{
      border-color:var(--pk-dark);
      background:linear-gradient(135deg,#FFC1C1, #FFE5E5);
      color:var(--pk-red-dark);
    }

    /* ── SHAKA CONTROLS ── */
    .sp-btn{
      background:transparent!important;border:none!important;
      cursor:pointer!important;padding:0 8px!important;
      opacity:.85;
      display:flex;align-items:center;justify-content:center;gap:5px;
      height:100%;min-width:36px;
      transition:opacity .15s,color .15s;
      color:#fff!important;
      -webkit-tap-highlight-color:transparent;
    }

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>
<script>
(function(){
"use strict";

var API = "https://raw.githubusercontent.com/srhady/willow-event/refs/heads/main/live_sports.json";

var $overlay  = document.getElementById("overlay");
var $loadMsg  = document.getElementById("loadMsg");
var $status   = document.getElementById("status");
var $list     = document.getElementById("channel-list");
var $grid     = document.getElementById("ch-grid");
var $pc       = document.getElementById("pc");
var $vid      = document.getElementById("v");
var _stTmr    = null;
var _allCards = [];
var _curFilter= "live";

function getTier(){
  var mem=navigator.deviceMemory||4,cores=navigator.hardwareConcurrency||4;
  var mob=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  var conn=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
  var net=conn?(conn.effectiveType||"4g"):"4g";
  if(!mob) return "high";
  if(mem<=1.5||cores<=2||net==="slow-2g"||net==="2g") return "low";
  if(mem<=3||cores<=4) return "mid";
  return "high";
}
var TIER=getTier();
var PROF={
  low: {buf:5,reBuf:1.5,behind:15,maxH:480,maxBw:1200000,bwEst:400000},
  mid: {buf:8,reBuf:1.5,behind:25,maxH:720,maxBw:3500000,bwEst:1000000},
  high:{buf:12,reBuf:1.5,behind:30,maxH:1080,maxBw:0,bwEst:2000000}
}[TIER];

var FITS=["contain","fill","cover"];
var MODE_LABEL={contain:"Fit",fill:"Fill",cover:"Zoom"};
var FICO={
  contain:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="2" y1="21" x2="22" y2="21"/></svg>',
  fill:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>',
  cover:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M6 7l3 3m0 0H7m2 0V8m9-1l-3 3m0 0h2m-2 0V8M6 13l3-3m0 0H7m2 0v2m9 1l-3-3m0 0h2m-2 0v2"/></svg>'
};
var PIP_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="12" width="7" height="5" rx="1" fill="currentColor" stroke="none"/></svg>';

var CAL_SVG='<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';
var CLK_SVG='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>';
var NL_SVG ='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>';

function toast(msg,type,dur){
  $status.textContent=msg;
  $status.className="show "+(type||"ok");
  if(_stTmr) clearTimeout(_stTmr);
  if(dur!==0){
    _stTmr=setTimeout(function(){
      $status.className=$status.className.replace("show","").trim();
      _stTmr=null;
    },dur||4000);
  }
}
function setMsg(m){$loadMsg&&($loadMsg.textContent=m);}
function hideOverlay(){$overlay&&($overlay.style.display="none");}
function getChId(){return new URLSearchParams(location.search).get("id")||"";}

window.filterCards=function(filter){
  _curFilter=filter;
  document.getElementById("tab-live").classList.toggle("active",filter==="live");
  document.getElementById("tab-upcoming").classList.toggle("active",filter==="upcoming");
  $grid.innerHTML="";
  var f=document.createDocumentFragment();
  _allCards.forEach(function(item){
    var isLive=item.status&&item.status.toUpperCase()==="LIVE";
    if(filter==="live"&&isLive) f.appendChild(item.el);
    else if(filter==="upcoming"&&!isLive) f.appendChild(item.el);
  });
  $grid.appendChild(f);
};

async function loadData(){
  var r=await fetch(API,{cache:"no-store",headers:{Accept:"application/json"}});
  if(!r.ok) throw new Error("HTTP "+r.status);
  var d=await r.json();
  var matches=d&&Array.isArray(d.Matches)?d.Matches:[];
  if(!matches.length) throw new Error("No matches found");
  return matches.map(function(m){
    var streamUrl="";
    if(m.stream_url_bravo&&m.stream_url_bravo["Akamai Server"]) streamUrl=m.stream_url_bravo["Akamai Server"];
    else if(m.stream_url_alpha&&m.stream_url_alpha["Akamai Server"]) streamUrl=m.stream_url_alpha["Akamai Server"];
    else if(m.stream_url_bravo&&Object.values(m.stream_url_bravo)[0]) streamUrl=Object.values(m.stream_url_bravo)[0];
    else if(m.stream_url_alpha&&Object.values(m.stream_url_alpha)[0]) streamUrl=Object.values(m.stream_url_alpha)[0];
    var keyId="00000000000000000000000000000000",key="00000000000000000000000000000000";
    if(m.drm_key){var parts=m.drm_key.split(":");if(parts.length===2){keyId=parts[0].trim();key=parts[1].trim();}}
    return {
      id:m.match_id||"match_"+Math.random().toString(36).substr(2,6),
      name:m.title||"Live Match",
      status:m.status||"",
      time:m.time||"",
      cover_image:m.cover_image||"",
      is_free:m.is_free!==undefined?m.is_free:true,
      stream_url:streamUrl,
      key_id:keyId,key:key,
      logo:m.cover_image||""
    };
  });
}

function buildCard(ch){
  var isLive=ch.status&&ch.status.toUpperCase()==="LIVE";
  var a=document.createElement("a");
  a.className="ch-card";
  a.href="?id="+encodeURIComponent(ch.id);

  var inner=document.createElement("div");
  inner.className="ch-card-inner";

  // card header (name + pokeball type badge)
  var header=document.createElement("div");
  header.className="card-header";
  var nameEl=document.createElement("div");
  nameEl.className="card-name";
  nameEl.textContent=ch.name;
  nameEl.title=ch.name;
  header.appendChild(nameEl);
  var typeIcon=document.createElement("div");
  typeIcon.className="card-hp";
  typeIcon.textContent=isLive?"VS":"⚡";
  typeIcon.style.fontFamily="var(--display)";
  if(isLive){
    typeIcon.textContent="LIVE";
    typeIcon.style.fontSize="10px";
    typeIcon.style.letterSpacing=".8px";
    typeIcon.style.background="linear-gradient(135deg,var(--pk-fire),var(--pk-red))";
    typeIcon.style.color="#fff";
    typeIcon.style.borderColor="var(--pk-dark)";
    typeIcon.style.paddingLeft="12px";
  }else{
    typeIcon.textContent="⚡";
    typeIcon.style.fontSize="14px";
    typeIcon.style.padding="0 6px";
  }
  header.appendChild(typeIcon);
  inner.appendChild(header);

  // image area
  var imgDiv=document.createElement("div");
  imgDiv.className="ch-img";
  if(ch.logo&&ch.logo.trim()){
    var img=document.createElement("img");
    img.src=ch.logo;img.alt=ch.name;img.loading="lazy";
    img.onerror=function(){this.style.display="none";};
    imgDiv.appendChild(img);
  } else {
    var ph=document.createElement("div");
    ph.className="ch-img-placeholder";
    ph.textContent=ch.name.split(" ").slice(0,2).map(function(w){return w[0];}).join("");
    imgDiv.appendChild(ph);
  }

  // live / upcoming badge
  var badge=document.createElement("div");
  if(isLive){
    badge.className="ch-img-badge live";
    badge.innerHTML='<span class="b-dot"></span>Live';
  } else {
    badge.className="ch-img-badge upcoming";
    badge.innerHTML=CAL_SVG+"Soon";
  }
  imgDiv.appendChild(badge);

  // free badge
  if(ch.is_free){
    var fb=document.createElement("div");
    fb.className="ch-free";fb.textContent="Free";
    imgDiv.appendChild(fb);
  }
  inner.appendChild(imgDiv);

  // time row
  if(ch.time){
    var timeEl=document.createElement("div");
    timeEl.className="card-time";
    timeEl.innerHTML=CLK_SVG+"<span>"+(isLive?ch.time:"Starts "+ch.time)+"</span>";
    inner.appendChild(timeEl);
  }

  // CTA
  var cta=document.createElement("div");
  if(isLive){
    cta.className="ch-cta watch";
    cta.innerHTML='<span class="play-tri"></span>Watch Now';
  } else {
    cta.className="ch-cta not-live";
    cta.innerHTML=NL_SVG+"Not Live Yet";
  }
  inner.appendChild(cta);

  a.appendChild(inner);
  return a;
}

function renderList(channels){
  hideOverlay();
  var liveCount=0,upCount=0;
  _allCards=[];
  channels.forEach(function(ch){
    var isLive=ch.status&&ch.status.toUpperCase()==="LIVE";
    if(isLive) liveCount++; else upCount++;
    _allCards.push({status:ch.status,el:buildCard(ch)});
  });
  document.getElementById("live-count").textContent=liveCount;
  document.getElementById("upcoming-count").textContent=upCount;
  filterCards(liveCount>0?"live":"upcoming");
  $list.style.display="flex";
}

function errMsg(msg){setMsg(msg);$overlay.style.display="flex";toast(msg,"err",0);}
function shakaErrStr(e){
  if(!e) return "Unknown error";
  var c={1:"Network",2:"Text",3:"Media",4:"Manifest",5:"Streaming",6:"DRM",7:"Player"};
  var s=(c[e.category]||"Err")+" "+e.category+":"+e.code;
  if(e.data&&e.data[0]&&typeof e.data[0]==="string") s+=" — "+e.data[0].slice(0,72);
  return s;
}
function ratioLabel(w,h){
  if(!w||!h) return "";
  function gcd(a,b){return b?gcd(b,a%b):a;}
  var g=gcd(w,h)||1,rw=w/g,rh=h/g;
  var common={"16:9":16/9,"4:3":4/3,"21:9":21/9,"1:1":1,"9:16":9/16,"3:2":3/2,"5:4":5/4,"2:1":2};
  var real=w/h,best=null,bestDiff=.02;
  Object.keys(common).forEach(function(k){var d=Math.abs(common[k]-real);if(d<bestDiff){bestDiff=d;best=k;}});
  if(best) return best;
  if(rw<=40&&rh<=40) return rw+":"+rh;
  return real.toFixed(2)+":1";
}

function injectControls(container,vid,player){
  var panel=container.querySelector(".shaka-controls-button-panel");
  if(!panel) return;
  var anchor=panel.querySelector(".shaka-fullscreen-button");
  var fitIdx=0;
  var fitBtn=document.createElement("button");
  fitBtn.className="sp-btn sp-fit-btn";fitBtn.title="Video fit: Fit";
  fitBtn.innerHTML='<span class="fit-icon">'+FICO.contain+'</span><span class="fit-ratio">--</span>';
  if(anchor) panel.insertBefore(fitBtn,anchor); else panel.appendChild(fitBtn);
  function applyFit(i){
    fitIdx=i;var m=FITS[i];
    vid.classList.remove("mode-fill","mode-cover");
    if(m==="fill") vid.classList.add("mode-fill");
    if(m==="cover") vid.classList.add("mode-cover");
    var ic=fitBtn.querySelector(".fit-icon");if(ic) ic.innerHTML=FICO[m];
    fitBtn.title="Video fit: "+MODE_LABEL[m];
  }
  fitBtn.addEventListener("click",function(e){e.stopPropagation();applyFit((fitIdx+1)%FITS.length);});
  ["fullscreenchange","webkitfullscreenchange"].forEach(function(ev){
    document.addEventListener(ev,function(){if(!(document.fullscreenElement||document.webkitFullscreenElement)) applyFit(0);});
  });
  function updateRatio(){var lbl=ratioLabel(vid.videoWidth,vid.videoHeight);var badge=fitBtn.querySelector(".fit-ratio");if(badge&&lbl) badge.textContent=lbl;}
  vid.addEventListener("loadedmetadata",updateRatio);
  vid.addEventListener("resize",updateRatio);updateRatio();
  var pipOk=!!(document.pictureInPictureEnabled||(vid.webkitSupportsPresentationMode&&typeof vid.webkitSetPresentationMode==="function"));
  if(pipOk){
    var pipBtn=document.createElement("button");
    pipBtn.className="sp-btn sp-pip-btn";pipBtn.title="Picture in Picture";pipBtn.innerHTML=PIP_ICON;
    panel.insertBefore(pipBtn,fitBtn);
    function setPipState(active){pipBtn.classList.toggle("active",active);pipBtn.title=active?"Exit Picture in Picture":"Picture in Picture";}
    pipBtn.addEventListener("click",async function(e){
      e.stopPropagation();
      try{
        if(document.pictureInPictureEnabled){if(document.pictureInPictureElement) await document.exitPictureInPicture();else await vid.requestPictureInPicture();}
        else if(vid.webkitSupportsPresentationMode) vid.webkitSetPresentationMode(vid.webkitPresentationMode==="picture-in-picture"?"inline":"picture-in-picture");
      } catch(_){toast("PiP unavailable","warn",2500);}
    });
    vid.addEventListener("enterpictureinpicture",function(){setPipState(true);});
    vid.addEventListener("leavepictureinpicture",function(){setPipState(false);});
    if(vid.webkitPresentationMode!==undefined) vid.addEventListener("webkitpresentationmodechanged",function(){setPipState(vid.webkitPresentationMode==="picture-in-picture");});
  }
}

async function startPlayer(ch){
  $pc.style.display="flex";
  shaka.polyfill.installAll();
  if(!shaka.Player.isBrowserSupported()){errMsg("Browser not supported.");return;}
  var player=new shaka.Player();
  await player.attach($vid);
  new shaka.ui.Overlay(player,$pc,$vid).configure({
    controlPanelElements:["play_pause","mute","volume","time_and_duration","spacer","quality","fullscreen"],
    seekBarColors:{base:"#3A3A3A",buffered:"#5a4a1a",played:"#FFCB05"}
  });
  setTimeout(function(){injectControls($pc,$vid,player);},100);

  var keyId=ch.key_id,key=ch.key,url=ch.stream_url;
  var restrictionsRelaxed=false;

  function buildCfg(){
    var restr={};
    if(!restrictionsRelaxed){if(PROF.maxH<1080) restr.maxHeight=PROF.maxH;if(PROF.maxBw>0) restr.maxBandwidth=PROF.maxBw;}
    return {
      drm:{clearKeys:{[keyId]:key}},
      manifest:{defaultPresentationDelay:4,ignoreTextStreamFailures:true,retryParameters:{maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:.5,timeout:30000}},
      streaming:{lowLatencyMode:false,bufferingGoal:PROF.buf,rebufferingGoal:PROF.reBuf,bufferBehind:PROF.behind,safeSeekOffset:4,stallEnabled:true,stallThreshold:1,stallSkip:.3,inaccurateManifestTolerance:0,retryParameters:{maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:.5,timeout:30000}},
      abr:{enabled:true,defaultBandwidthEstimate:PROF.bwEst,switchInterval:4,restrictions:restr}
    };
  }

  player.configure(buildCfg());
  player.getNetworkingEngine().registerRequestFilter(function(type,req){
    req.headers["Referer"]="https://www.jiotv.com/";
    req.headers["User-Agent"]="Mozilla/5.0 (Linux; Android 11; SM-G991B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36";
  });

  var refreshing=false,retries=0,edgeTried=false,lastTry=0,started=false;

  function unmuteOnce(){$vid.muted=false;}
  $pc.addEventListener("pointerdown",unmuteOnce,{capture:true,once:true});
  $pc.addEventListener("click",unmuteOnce,{capture:true,once:true});
  $pc.addEventListener("keydown",unmuteOnce,{capture:true,once:true});

  function goLiveEdge(){if(refreshing) return;try{player.goToLive();edgeTried=true;toast("Syncing…","warn",2000);}catch(_){reload();}}

  async function reload(){
    var now=Date.now();
    if(refreshing||now-lastTry<1500) return;
    if(retries>=5){toast("Stream unavailable.","err",0);return;}
    refreshing=true;lastTry=now;retries++;
    toast("Reconnecting… ("+retries+"/5)","warn",0);
    try{
      var channels=await loadData();
      var fresh=channels.find(function(c){return c.id===ch.id;});
      if(!fresh) throw new Error("missing");
      keyId=fresh.key_id;key=fresh.key;url=fresh.stream_url;
      player.configure(buildCfg());
      await player.load(url);
      $vid.play().catch(function(){});
      retries=0;edgeTried=false;
      toast("● Live","ok",4000);
    } catch(_){setTimeout(reload,Math.min(1000*Math.pow(2,retries-1),8000));}
    finally{refreshing=false;}
  }

  var RECOVERABLE=[1001,1002,1003,4012,6006,6007,7000,7001,7002];
  player.addEventListener("error",function(ev){
    var err=ev.detail,code=err&&err.code;
    if(code===4014&&!restrictionsRelaxed){
      restrictionsRelaxed=true;refreshing=true;
      player.configure(buildCfg());toast("Playing best available quality","warn",2500);
      player.load(url).then(function(){$vid.play().catch(function(){});toast("● Live","ok",4000);}).catch(function(){reload();}).finally(function(){refreshing=false;});
      return;
    }
    if(RECOVERABLE.indexOf(code)!==-1) reload();
    else toast(shakaErrStr(err),"err",6000);
  });

  try{
    setMsg("Loading stream…");toast("Loading…","warn",0);
    await player.load(url);
    hideOverlay();toast("Tap ▶ to start","ok",5000);
  } catch(_){
    hideOverlay();toast("Retrying…","warn",0);
    setTimeout(reload,1500);return;
  }

  var stallTmr=null;
  function onStall(){if(!started||stallTmr||refreshing) return;toast("Buffering…","warn",0);stallTmr=setTimeout(function(){stallTmr=null;if(!edgeTried) goLiveEdge();else reload();},5000);}
  function onPlaying(){started=true;if(stallTmr){clearTimeout(stallTmr);stallTmr=null;}edgeTried=false;if(!refreshing) toast("● Live","ok",3000);}
  $vid.addEventListener("waiting",onStall);$vid.addEventListener("stalled",onStall);
  $vid.addEventListener("playing",onPlaying);$vid.addEventListener("error",function(){if(!refreshing) reload();});
  document.addEventListener("visibilitychange",function(){if(!document.hidden){setTimeout(function(){if(started&&$vid.paused&&!refreshing) $vid.play().catch(function(){});},400);}});
  var netConn=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
  if(netConn){netConn.addEventListener("change",function(){if(!player||restrictionsRelaxed) return;var t=netConn.effectiveType||"4g";var h=t==="slow-2g"||t==="2g"?240:t==="3g"?480:PROF.maxH;try{player.configure("abr.restrictions.maxHeight",h);}catch(_){}if(h<PROF.maxH) toast("Slow network — reducing quality","warn",3000);});}
}

async function main(){
  var id=getChId(),channels;
  try{setMsg("Fetching matches…");channels=await loadData();}
  catch(_){errMsg("Connection error.");return;}
  if(!id){renderList(channels);return;}
  var ch=channels.find(function(c){return c.id===id;});
  if(!ch){errMsg("Match not found.");return;}
  document.title="Sportlink · "+ch.name;
  await startPlayer(ch);
}

document.addEventListener("DOMContentLoaded",main);
})();
</script>
