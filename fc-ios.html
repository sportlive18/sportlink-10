<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>SPORTLINK · Fancode Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css"/>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>
  <script src="https://pl31358401.profitableratecpmnetwork.com/a3/81/41/a38141b4ff99f6ef8dbf9dc5f76bd86b.js"></script>
  <style>
    :root {
      --bg: #0b0e1a;
      --surface: #111827;
      --surface2: #1a2235;
      --border: rgba(255,255,255,0.07);
      --text: #f0f4ff;
      --muted: #6b7280;
      --accent: #3b82f6;
      --accent2: #6366f1;
      --live: #ef4444;
      --upcoming: #f59e0b;
      --watch-btn: #3b6cf8;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      width:100%; min-height:100%; background:var(--bg);
      font-family:'Inter',system-ui,sans-serif; color:var(--text);
      -webkit-font-smoothing:antialiased;
    }

    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:#2d3748; border-radius:4px; }

    /* ─── TELEGRAM BADGE (only social badge) ─── */
    #tgBadge{
      position:fixed;
      top:max(14px,env(safe-area-inset-top));
      left:max(14px,env(safe-area-inset-left));
      z-index:10001;
      display:inline-flex;align-items:center;gap:10px;
      padding:11px 20px;
      background:linear-gradient(135deg,#1e88e5,#1565c0);
      color:#fff;
      font-size:15px;
      font-weight:600;
      letter-spacing:.3px;
      text-decoration:none;
      border-radius:12px;
      box-shadow:0 4px 14px rgba(0,0,0,0.5);
      transition:transform .2s ease,box-shadow .2s ease;
      -webkit-tap-highlight-color:transparent;
      font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    }
    #tgBadge:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(30,136,229,0.55)}
    #tgBadge:active{transform:scale(.97)}
    #tgBadge svg{width:20px;height:20px;flex-shrink:0;fill:#fff}
    #tgBadge span{white-space:nowrap}

    @media (max-width:400px){
      #tgBadge{padding:9px 15px;font-size:13px;gap:8px}
      #tgBadge svg{width:17px;height:17px}
    }
    @media (max-width:340px){
      #tgBadge span{display:none}
      #tgBadge{padding:9px 12px}
    }

    #overlay {
      position:fixed; inset:0; background:var(--bg); z-index:9999;
      display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px;
    }
    #overlay svg { animation:spin 1s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    #overlay p { color:var(--muted); font-size:13px; font-weight:500; }

    #status {
      position:fixed; top:max(14px,env(safe-area-inset-top)); right:max(14px,env(safe-area-inset-right));
      z-index:9997; padding:6px 14px; background:rgba(11,14,26,.92);
      border:1px solid rgba(255,255,255,.08); font-size:11px; font-weight:600;
      border-radius:20px; pointer-events:none; opacity:0; transition:opacity .3s;
      backdrop-filter:blur(8px); color:var(--accent);
    }
    #status.show { opacity:1; }
    #status.warn { color:var(--upcoming); }
    #status.err  { color:var(--live); }

    #app-header {
      position:sticky; top:0; z-index:100;
      background:rgba(11,14,26,.85); backdrop-filter:blur(16px);
      border-bottom:1px solid var(--border);
      padding:0 24px;
    }
    #header-inner {
      max-width:1320px; margin:0 auto;
      display:flex; align-items:center; justify-content:space-between;
      height:64px; gap:16px;
    }
    .logo-wrap { display:flex; align-items:center; gap:10px; }
    .logo-icon {
      width:36px; height:36px; border-radius:10px;
      background:linear-gradient(135deg,#3b82f6,#6366f1);
      display:flex; align-items:center; justify-content:center;
      font-size:18px; flex-shrink:0;
    }
    .logo-text { font-size:18px; font-weight:900; letter-spacing:-.5px; color:#fff; }
    .logo-sub { font-size:10px; font-weight:500; color:var(--muted); letter-spacing:.5px; margin-left:2px; }
    #theme-toggle {
      display:flex; align-items:center; gap:7px; padding:7px 14px;
      background:var(--surface2); border:1px solid var(--border); border-radius:10px;
      color:var(--muted); font-size:12px; font-weight:500; cursor:pointer;
      font-family:inherit; transition:all .2s;
    }
    #theme-toggle:hover { border-color:var(--accent); color:var(--text); }

    #channel-list { display:none; min-height:100vh; }
    #channel-list.visible { display:block; }

    #content-wrap { max-width:1320px; margin:0 auto; padding:28px 24px 48px; }

    .section-head { display:flex; align-items:center; gap:10px; margin-bottom:20px; }
    .live-dot {
      width:8px; height:8px; border-radius:50%; background:var(--live);
      animation:pulse 1.2s ease-in-out infinite; flex-shrink:0;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.85)} }
    .section-label {
      font-size:11px; font-weight:700; letter-spacing:1.5px;
      text-transform:uppercase; color:var(--muted);
    }
    .section-count {
      font-size:11px; font-weight:700; color:var(--live);
      background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.2);
      padding:2px 9px; border-radius:20px;
    }

    #category-filter {
      display:flex; gap:8px; margin-bottom:28px;
      overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
    }
    #category-filter::-webkit-scrollbar { display:none; }
    .filter-pill {
      flex-shrink:0; padding:7px 18px; border-radius:24px;
      font-size:11px; font-weight:600; letter-spacing:.3px;
      text-transform:uppercase; cursor:pointer; white-space:nowrap;
      background:var(--surface); color:var(--muted);
      border:1px solid var(--border); transition:all .2s; font-family:inherit;
    }
    .filter-pill:hover { border-color:var(--accent); color:var(--text); }
    .filter-pill.active {
      background:linear-gradient(135deg,#3b82f6,#6366f1);
      color:#fff; border-color:transparent;
      box-shadow:0 4px 16px rgba(59,130,246,.3);
    }

    .ad-slot {
      width:100%; min-height:60px; margin:0 0 24px;
      display:flex; align-items:center; justify-content:center;
      background:var(--surface); border:1px dashed var(--border);
      border-radius:12px; overflow:hidden; padding:10px;
    }
    .ad-slot:empty { display:none; }

    #ch-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
      gap:20px;
    }

    .ch-card {
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:16px; overflow:hidden;
      cursor:pointer; text-decoration:none; color:inherit;
      display:flex; flex-direction:column;
      transition:transform .25s, box-shadow .25s, border-color .25s;
      -webkit-tap-highlight-color:transparent;
    }
    .ch-card:hover {
      transform:translateY(-4px);
      box-shadow:0 12px 40px rgba(0,0,0,.5);
      border-color:rgba(59,130,246,.35);
    }
    .ch-card:active { transform:scale(.98); }
    .ch-card.disabled { opacity:.65; cursor:not-allowed; }

    .card-thumb {
      position:relative; width:100%; aspect-ratio:16/9;
      overflow:hidden; background:#0d111f;
      display:flex; align-items:center; justify-content:center;
    }
    .card-thumb img {
      width:100%; height:100%; object-fit:cover;
      transition:transform .35s;
    }
    .card-thumb img.logo-fit {
      object-fit:cover; background:#0d111f;
    }
    .ch-card:hover .card-thumb img { transform:scale(1.04); }

    .card-thumb .thumb-placeholder {
      width:100%; height:100%;
      background:linear-gradient(135deg,#111827,#1e2a45);
      display:flex; align-items:center; justify-content:center;
      font-size:48px; font-weight:900; letter-spacing:2px;
      color:rgba(59,130,246,.35);
    }

    .badge-live {
      position:absolute; top:12px; left:12px;
      display:inline-flex; align-items:center; gap:5px;
      padding:4px 10px; border-radius:8px;
      background:rgba(239,68,68,.9); backdrop-filter:blur(6px);
      font-size:10px; font-weight:700; letter-spacing:.8px;
      text-transform:uppercase; color:#fff;
    }
    .badge-live::before {
      content:''; width:6px; height:6px; border-radius:50%;
      background:#fff; animation:pulse 1.2s ease-in-out infinite;
    }
    .badge-upcoming {
      position:absolute; top:12px; left:12px;
      padding:4px 10px; border-radius:8px;
      background:rgba(245,158,11,.9); backdrop-filter:blur(6px);
      font-size:10px; font-weight:700; letter-spacing:.8px;
      text-transform:uppercase; color:#000;
    }
    .badge-cat {
      position:absolute; top:12px; right:12px;
      padding:4px 10px; border-radius:8px;
      background:rgba(11,14,26,.7); backdrop-filter:blur(6px);
      border:1px solid rgba(255,255,255,.1);
      font-size:9px; font-weight:600; letter-spacing:.8px;
      text-transform:uppercase; color:rgba(255,255,255,.7);
    }

    .card-body {
      padding:16px 18px 18px; display:flex; flex-direction:column; gap:12px;
      flex:1;
    }
    .card-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .meta-event {
      font-size:10px; font-weight:600; letter-spacing:.5px;
      text-transform:uppercase; color:var(--muted);
    }
    .meta-lang {
      font-size:9px; font-weight:700; padding:2px 7px; border-radius:6px;
      background:rgba(99,102,241,.15); border:1px solid rgba(99,102,241,.3);
      color:#a5b4fc; letter-spacing:.6px;
    }

    .card-title {
      font-size:15px; font-weight:700; line-height:1.4; color:var(--text);
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .card-info { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
    .info-chip {
      display:inline-flex; align-items:center; gap:5px;
      font-size:10px; font-weight:500; color:var(--muted);
    }
    .info-chip svg { width:12px; height:12px; opacity:.6; flex-shrink:0; }

    .watch-btn {
      display:flex; align-items:center; justify-content:center; gap:8px;
      padding:11px 0; border-radius:10px;
      background:linear-gradient(135deg,#3b6cf8,#5b4cf8);
      color:#fff; font-size:13px; font-weight:700; letter-spacing:.3px;
      border:none; cursor:pointer; font-family:inherit;
      transition:filter .2s, transform .15s;
      -webkit-tap-highlight-color:transparent;
      margin-top:auto;
    }
    .watch-btn:hover { filter:brightness(1.12); }
    .watch-btn:active { transform:scale(.97); }
    .watch-btn svg { width:16px; height:16px; }
    .watch-btn:disabled {
      background:var(--surface2); color:var(--muted); cursor:not-allowed;
    }

    #empty-state {
      display:none; text-align:center; padding:80px 24px;
    }
    #empty-state p { color:var(--muted); font-size:14px; }

    #player-container {
      position:fixed; inset:0; background:#000; z-index:9997;
      display:none; align-items:center; justify-content:center;
    }
    #player-container video { width:100%; height:100%; object-fit:contain; }
    .plyr { height:100%; width:100%; background:#000; }
    .plyr__controls { background:linear-gradient(0,rgba(0,0,0,.9),transparent)!important; }
    .plyr__control--overlaid { background:linear-gradient(135deg,#3b82f6,#6366f1)!important; }
    .plyr__progress__played { background:linear-gradient(90deg,#3b82f6,#6366f1)!important; }

    #ad-container {
      position:absolute; inset:0; z-index:5;
      background:#000; display:none; overflow:hidden;
    }
    #ad-container.active { display:block; }
    #ad-container video, #ad-container iframe { width:100%; height:100%; }

    /* ═══ QUALITY PICKER ═══ */
    #quality-wrap {
      position:absolute;
      top:max(14px,env(safe-area-inset-top));
      right:max(14px,env(safe-area-inset-right));
      z-index:20;
      display:none;
    }
    #quality-wrap.show { display:block; }

    #quality-btn {
      display:inline-flex; align-items:center; gap:7px;
      padding:8px 14px;
      background:rgba(11,14,26,.85);
      border:1px solid rgba(255,255,255,.15);
      border-radius:10px;
      color:#fff;
      font-size:12px;
      font-weight:700;
      letter-spacing:.3px;
      cursor:pointer;
      backdrop-filter:blur(10px);
      font-family:'Inter',system-ui,sans-serif;
      transition:all .2s;
    }
    #quality-btn:hover { border-color:#3b82f6; }
    #quality-btn svg { width:14px; height:14px; }
    #quality-btn.open { border-color:#3b82f6; background:rgba(59,130,246,.2); }

    #quality-menu {
      position:absolute;
      top:calc(100% + 8px);
      right:0;
      min-width:140px;
      background:rgba(15,20,35,.97);
      border:1px solid rgba(255,255,255,.12);
      border-radius:14px;
      padding:6px;
      box-shadow:0 20px 50px rgba(0,0,0,.7);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      display:none;
      max-height:60vh;
      overflow-y:auto;
    }
    #quality-menu.show { display:block; }

    .q-header {
      font-size:10px;
      font-weight:800;
      letter-spacing:1.2px;
      text-transform:uppercase;
      color:#6b7280;
      padding:8px 12px 6px;
      border-bottom:1px solid rgba(255,255,255,.06);
      margin-bottom:4px;
    }

    .q-item {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      width:100%;
      padding:9px 12px;
      background:transparent;
      border:none;
      border-radius:8px;
      color:#e2e8f0;
      font-size:12.5px;
      font-weight:600;
      font-family:'Inter',system-ui,sans-serif;
      cursor:pointer;
      transition:background .15s;
      text-align:left;
    }
    .q-item:hover { background:rgba(59,130,246,.15); }
    .q-item.active {
      background:rgba(59,130,246,.25);
      color:#60a5fa;
    }
    .q-item.active::after {
      content:'✓';
      font-weight:800;
      color:#60a5fa;
    }
    .q-item .q-auto {
      font-size:10px;
      padding:2px 7px;
      border-radius:6px;
      background:rgba(99,102,241,.2);
      border:1px solid rgba(99,102,241,.3);
      color:#a5b4fc;
      letter-spacing:.5px;
      font-weight:700;
    }

    @media (max-width:640px) {
      #quality-btn span { display:none; }
      #quality-btn { padding:8px; }
      #quality-menu { min-width:120px; }
    }

    @media (max-width:640px){
      #content-wrap { padding:20px 16px 40px; }
      #ch-grid { grid-template-columns:1fr; gap:14px; }
      #header-inner { padding:0; }
      #app-header { padding:0 16px; }
    }
    @media (min-width:641px) and (max-width:1024px) {
      #ch-grid { grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); }
    }

    body.light {
      --bg:#f0f4f8; --surface:#ffffff; --surface2:#e8edf3;
      --border:rgba(0,0,0,.08); --text:#0f172a; --muted:#64748b;
    }
    body.light #app-header { background:rgba(240,244,248,.9); }
    body.light .card-thumb .thumb-placeholder {
      background:linear-gradient(135deg,#e2e8f0,#cbd5e1);
      color:rgba(59,130,246,.35);
    }
    body.light .badge-cat { background:rgba(255,255,255,.85); color:#374151; }

    #tgOverlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: none; align-items: center; justify-content: center;
      z-index: 999999; padding: 20px;
      animation: fadeInPopup 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    #tgOverlay.show { display: flex; }

    #tgCard {
      width: 100%; max-width: 400px;
      background: linear-gradient(160deg, #121821, #0a0c0f);
      border: 1px solid rgba(79, 195, 247, 0.15);
      border-radius: 24px; padding: 36px 28px 28px;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), 0 0 60px rgba(79, 195, 247, 0.03);
      text-align: center; position: relative; overflow: hidden;
    }
    #tgCard::before {
      content: ""; position: absolute;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle at 30% 20%, rgba(79, 195, 247, 0.04), transparent 60%);
      pointer-events: none;
    }
    #tgIcon {
      width: 72px; height: 72px; margin: 0 auto 16px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #2AABEE, #229ED9);
      box-shadow: 0 0 40px rgba(42, 171, 238, 0.2);
      position: relative; z-index: 1;
    }
    #tgIcon svg { width: 36px; height: 36px; }
    #tgCard h2 {
      margin: 0 0 8px;
      font-size: clamp(1.3rem, 2.5vw, 1.8rem);
      font-weight: 700; color: #ffffff;
      font-family: 'Inter', system-ui, sans-serif;
      position: relative; z-index: 1; letter-spacing: -0.01em;
    }
    #tgCard p {
      margin: 0 0 24px; color: #8e9baf;
      font-size: clamp(0.9rem, 1.2vw, 1.05rem);
      line-height: 1.6; position: relative; z-index: 1;
    }
    .tgBtns { display: flex; gap: 12px; position: relative; z-index: 1; }
    .tgBtn {
      flex: 1; height: 48px; border-radius: 40px;
      font-weight: 700; font-size: clamp(0.85rem, 1vw, 1rem);
      cursor: pointer; transition: all 0.25s ease;
      border: none; font-family: 'Inter', sans-serif;
      letter-spacing: 0.01em;
    }
    #joinNow {
      background: linear-gradient(135deg, #4fc3f7, #2196f3);
      color: #ffffff; box-shadow: 0 6px 24px rgba(79, 195, 247, 0.25);
    }
    #joinNow:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(79, 195, 247, 0.35); }
    #joinedBtn {
      background: rgba(255, 255, 255, 0.05);
      color: #8e9baf; border: 1px solid rgba(255, 255, 255, 0.08);
    }
    #joinedBtn:hover { background: rgba(255, 255, 255, 0.08); color: #ffffff; }
    @keyframes fadeInPopup {
      from { opacity: 0; transform: scale(0.95) translateY(12px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    @media (max-width: 480px) {
      #tgCard { padding: 24px 18px 20px; border-radius: 20px; }
      #tgIcon { width: 60px; height: 60px; }
      #tgIcon svg { width: 30px; height: 30px; }
      #tgCard h2 { font-size: 1.2rem; }
      #tgCard p { font-size: 0.85rem; margin-bottom: 18px; }
      .tgBtn { height: 42px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

<!-- ✅ Single Telegram badge, only social element -->

<div id="overlay">
  <svg width="36" height="36" viewBox="0 0 40 40" fill="none">
    <circle cx="20" cy="20" r="16" stroke="#1e2a45" stroke-width="4"/>
    <path d="M20 4a16 16 0 0 1 16 16" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  </svg>

</div>

<div id="status"></div>

<header id="app-header">
  <div id="header-inner">
    <div class="logo-wrap">
      <div class="logo-icon">⚡</div>
      <div>
        <div class="logo-text">SPORTLINK</div>
        <div class="logo-sub">Fancode · Sayan</div>
      </div>
    </div>
    <button id="theme-toggle">

<script>
(function(){
"use strict";

/* ═══════════════════════════════════════════════════════════════
   AD CONFIGURATION
   ═══════════════════════════════════════════════════════════════ */
var VAST_TAG   = "";
var AD_TIMEOUT = 8000;

/* ═══════════════════════════════════════════════════════════════
   SOURCE CONFIG
   ═══════════════════════════════════════════════════════════════ */
var JSON_URL   = "https://sportlink-fancode10.pages.dev/fan.json";
var PROXY_BASE = "https://sportlink10-sonyproxy.lovable.app/api/public/proxy?u=";
var USE_PROXY_FOR_STREAMS = true;

/* ═══ DOM ═══ */
var $overlay   = document.getElementById("overlay");
var $loadMsg   = document.getElementById("loadMsg");
var $status    = document.getElementById("status");
var $list      = document.getElementById("channel-list");
var $grid      = document.getElementById("ch-grid");
var $filter    = document.getElementById("category-filter");
var $pCont     = document.getElementById("player-container");
var $video     = document.getElementById("player");
var $themeBtn  = document.getElementById("theme-toggle");
var $liveHead  = document.getElementById("live-section-head");
var $liveCount = document.getElementById("live-count");
var $empty     = document.getElementById("empty-state");
var $qualityWrap = document.getElementById("quality-wrap");
var $qualityBtn  = document.getElementById("quality-btn");
var $qualityMenu = document.getElementById("quality-menu");
var $qualityList = document.getElementById("quality-list");
var $qualityLabel= document.getElementById("quality-label");

var _stTmr = null;
var allMatches = [];
var currentCategory = 'All';
var currentHls = null;
var currentPlayer = null;
var resumeTmr = null;
var retryTmr = null;
var unmuteHandler = null;
var currentAdsLoader = null;
var currentAdsManager = null;
var playToken = 0;

/* Quality state */
var currentMatchObj = null;
var currentQualities = {};
var currentQualityKey = 'auto';

// ── HELPERS ──
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function getInitials(name){
  var w = String(name||'').trim().split(/\s+/).filter(Boolean);
  if(!w.length) return '?';
  return w.length === 1 ? w[0].substring(0,2).toUpperCase() : (w[0][0]+w[1][0]).toUpperCase();
}

// ── THEME ──
var isLight = false;
$themeBtn.addEventListener('click', function(){
  isLight = !isLight;
  document.body.classList.toggle('light', isLight);
  $themeBtn.innerHTML = isLight
    ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg> Dark Mode'
    : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg> Light Mode';
});

// ── TOAST ──
function toast(msg, type, dur){
  $status.textContent = msg;
  $status.className = "show " + (type||"ok");
  if(_stTmr) clearTimeout(_stTmr);
  if(dur !== 0) _stTmr = setTimeout(function(){ $status.className = ""; _stTmr = null; }, dur||4000);
}
function setMsg(m){ if($loadMsg) $loadMsg.textContent = m; }
function hideOverlay(){ if($overlay) $overlay.style.display = "none"; }
function getMatchId(){ return new URLSearchParams(location.search).get("id") || ""; }

/* ── PROXY (streams only) ── */
function proxyUrl(url){
  if(!url) return url;
  if(!USE_PROXY_FOR_STREAMS) return url;
  if(url.indexOf(PROXY_BASE) === 0) return url;
  return PROXY_BASE + encodeURIComponent(url);
}

/* ── LOAD JSON ── */
async function loadData(){
  var r = await fetch(JSON_URL, {cache:"no-store"});
  if(!r.ok) throw new Error("HTTP " + r.status);
  var data = await r.json();
  if(!data || !Array.isArray(data.matches)) throw new Error("Bad JSON shape");
  if(!data.matches.length) throw new Error("No matches in feed");
  return data.matches;
}

function getPlayable(match){
  if(match.status !== 'LIVE') return null;

  if(match.auto_streams){
    var langs = Object.keys(match.auto_streams);
    for(var i=0;i<langs.length;i++){
      var lang = langs[i];
      var entry = match.auto_streams[lang];
      if(entry && entry.streams){
        var url = entry.streams['1080p'] || entry.streams['720p']
               || entry.streams['540p'] || entry.streams['480p']
               || entry.streams['360p'] || entry.streams['240p'];
        if(url){
          return { url: url, cookie: entry.cookie || '', language: lang };
        }
      }
    }
  }

  if(match.streams && match.streams.primary){
    return { url: match.streams.primary, cookie: '', language: match.language || '' };
  }

  return null;
}

/* Build quality map: { '1080p': {url, cookie, lang}, ... } */
function buildQualities(match, preferredLang){
  var out = {};

  if(match.auto_streams){
    Object.keys(match.auto_streams).forEach(function(lang){
      var entry = match.auto_streams[lang];
      if(!entry || !entry.streams) return;
      Object.keys(entry.streams).forEach(function(res){
        var score = (lang === preferredLang) ? 1 : 0;
        if(!out[res] || score > (out[res]._score || 0)){
          out[res] = {
            url: entry.streams[res],
            cookie: entry.cookie || '',
            lang: lang,
            _score: score
          };
        }
      });
    });
  }

  if(!Object.keys(out).length && match.streams && match.streams.primary){
    out['Auto'] = { url: match.streams.primary, cookie: '', lang: match.language || '' };
  }

  return out;
}

function bestQualityKey(){
  var order = ['1080p','720p','540p','480p','360p','240p'];
  for(var i=0;i<order.length;i++){
    if(currentQualities[order[i]]) return order[i];
  }
  if(currentQualities['Auto']) return 'Auto';
  return null;
}

// ── FILTERS ──
function renderFilters(matches){
  var seen = {}, cats = ['All'];
  matches.forEach(function(m){
    if(m.category) seen[m.category] = true;
  });
  Object.keys(seen).sort().forEach(function(c){ cats.push(c); });

  var f = document.createDocumentFragment();
  cats.forEach(function(cat){
    var pill = document.createElement('button');
    pill.className = 'filter-pill' + (cat === currentCategory ? ' active' : '');
    pill.textContent = cat;
    pill.dataset.category = cat;
    pill.addEventListener('click', function(){
      currentCategory = cat;
      document.querySelectorAll('.filter-pill').forEach(function(p){
        p.classList.toggle('active', p.dataset.category === cat);
      });
      renderMatches(matches);
    });
    f.appendChild(pill);
  });
  $filter.innerHTML = '';
  $filter.appendChild(f);
}

// ── CARDS ──
function renderMatches(matches){
  var filtered = currentCategory === 'All' ? matches
    : matches.filter(function(m){ return m.category === currentCategory; });

  filtered = filtered.slice().sort(function(a,b){
    var aLive = a.status === 'LIVE' ? 0 : 1;
    var bLive = b.status === 'LIVE' ? 0 : 1;
    if(aLive !== bLive) return aLive - bLive;
    return String(a.startTime||'').localeCompare(String(b.startTime||''));
  });

  var liveCount = filtered.filter(function(m){ return m.status === 'LIVE'; }).length;
  if(liveCount > 0){
    $liveHead.style.display = 'flex';
    $liveCount.textContent = liveCount;
  } else {
    $liveHead.style.display = 'none';
  }

  $empty.style.display = filtered.length ? 'none' : 'block';
  $grid.innerHTML = '';
  if(!filtered.length) return;

  var f = document.createDocumentFragment();
  filtered.forEach(function(m){
    var playable = !!getPlayable(m);
    var isLive = m.status === 'LIVE';
    var card = document.createElement('div');
    card.className = 'ch-card' + (playable ? '' : ' disabled');
    card.setAttribute('tabindex', '0');
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', m.title || 'Match');

    var catBadge = m.category
      ? '<span class="badge-cat">' + esc(m.category) + '</span>' : '';

    var statusBadge = isLive
      ? '<span class="badge-live">LIVE</span>'
      : '<span class="badge-upcoming">UPCOMING</span>';

    var init = getInitials(m.title);
    var thumbInner = m.image && m.image.trim()
      ? '<img src="' + esc(m.image) + '" alt="' + esc(m.title) + '" loading="lazy" ' +
        'onerror="this.onerror=null;this.outerHTML=\'<div class=&quot;thumb-placeholder&quot;>'+init+'</div>\'">'
      : '<div class="thumb-placeholder">' + init + '</div>';

    var langChip = m.language
      ? '<span class="meta-lang">' + esc(m.language) + '</span>' : '';

    var tournamentChip = m.tournament
      ? '<span class="meta-event">' + esc(m.tournament) + '</span>' : '';

    var startChip = m.startTime
      ? '<span class="info-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' + esc(m.startTime) + '</span>' : '';

    var btnLabel = playable
      ? '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg> Watch Live'
      : (isLive ? 'Stream Loading…' : 'Not Started');

    card.innerHTML =
      '<div class="card-thumb">' + thumbInner +
        statusBadge +
        catBadge +
      '</div>' +
      '<div class="card-body">' +
        ((tournamentChip || langChip) ? '<div class="card-meta">' + tournamentChip + langChip + '</div>' : '') +
        '<div class="card-title">' + esc(m.title) + '</div>' +
        (startChip ? '<div class="card-info">' + startChip + '</div>' : '') +
        '<button class="watch-btn"' + (playable ? '' : ' disabled') + '>' + btnLabel + '</button>' +
      '</div>';

    if(playable){
      function play(e){
        e.preventDefault();
        if(window.history && window.history.pushState)
          window.history.pushState({}, '', '?id=' + encodeURIComponent(m.match_id));
        document.title = 'SPORTLINK · ' + m.title;
        var info = getPlayable(m);
        setupHLSPlayer(info.url, m.title, info.cookie, m);
      }
      card.addEventListener('click', play);
      card.addEventListener('keydown', function(e){
        if(e.key==='Enter'||e.key===' '){ e.preventDefault(); play(e); }
      });
    } else {
      card.addEventListener('click', function(){
        toast(isLive ? 'Stream not ready yet' : 'Match has not started', 'warn', 3000);
      });
    }

    f.appendChild(card);
  });
  $grid.appendChild(f);
}

// ── RENDER LIST ──
function renderList(matches){
  hideOverlay();
  allMatches = matches;
  renderFilters(allMatches);
  renderMatches(allMatches);
  $list.classList.add('visible');
}

// ── PLAYER SHOW/HIDE ──
function showPlayer(){
  $list.classList.remove('visible');
  $pCont.style.display = 'flex';
  if (typeof window.showTelegramPopup === 'function') {
    window.showTelegramPopup();
  }
}

/* Full clean rebuild of the video element + Plyr wrapper */
function buildFreshPlayer(){
  // Destroy existing Plyr + Hls first
  if(currentHls){ try{ currentHls.destroy(); }catch(e){} currentHls = null; }
  if(currentPlayer){ try{ currentPlayer.destroy(); }catch(e){} currentPlayer = null; }

  // Nuke the player-container and rebuild
  $pCont.innerHTML =
    '<div id="ad-container"></div>' +
    '<video id="player" playsinline webkit-playsinline controls preload="metadata"></video>' +
    '<div id="quality-wrap">' +
      '<button id="quality-btn" title="Quality">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>' +
        '<span id="quality-label">Auto</span>' +
      '</button>' +
      '<div id="quality-menu">' +
        '<div class="q-header">Quality</div>' +
        '<div id="quality-list"></div>' +
      '</div>' +
    '</div>';

  $video        = document.getElementById('player');
  $qualityWrap  = document.getElementById('quality-wrap');
  $qualityBtn   = document.getElementById('quality-btn');
  $qualityMenu  = document.getElementById('quality-menu');
  $qualityList  = document.getElementById('quality-list');
  $qualityLabel = document.getElementById('quality-label');

  bindQualityEvents();

  try {
    currentPlayer = new Plyr($video, {
      controls:['play','progress','current-time','mute','volume','captions','settings','fullscreen'],
      settings:[], autoplay:true, muted:true
    });

    // Redirect Plyr's fullscreen button to fullscreen the whole
    // player-container (so #quality-wrap survives fullscreen).
    setupFullscreenIntercept();
  } catch(e){}
}

/* ═══════════════════════════════════════════════════════════════
   FULLSCREEN FIX
   Plyr's own fullscreen button normally fullscreens the .plyr
   wrapper — which hides #quality-wrap (a sibling of .plyr inside
   #player-container). We intercept the click and request fullscreen
   on #player-container instead, so the quality picker stays visible
   in the top-right corner even in fullscreen.
   ═══════════════════════════════════════════════════════════════ */
function setupFullscreenIntercept(){
  if(!currentPlayer || !currentPlayer.elements || !currentPlayer.elements.buttons) return;
  var fsBtn = currentPlayer.elements.buttons.fullscreen;
  if(!fsBtn) return;
  if(fsBtn.dataset.fsIntercepted === '1') return;

  // Clone to strip Plyr's own click listener
  var newBtn = fsBtn.cloneNode(true);
  newBtn.dataset.fsIntercepted = '1';
  fsBtn.parentNode.replaceChild(newBtn, fsBtn);
  currentPlayer.elements.buttons.fullscreen = newBtn;

  newBtn.addEventListener('click', function(e){
    e.preventDefault();
    e.stopPropagation();
    togglePlayerContainerFullscreen();
  });
}

async function togglePlayerContainerFullscreen(){
  var fsEl = document.fullscreenElement || document.webkitFullscreenElement;

  if(fsEl){
    /* ── EXIT ── */
    try {
      if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    } catch(e){}
    try {
      if(document.exitFullscreen) await document.exitFullscreen();
      else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    } catch(e){}
  } else {
    /* ── ENTER ── */
    try {
      if($pCont.requestFullscreen){
        await $pCont.requestFullscreen();
      } else if($pCont.webkitRequestFullscreen){
        $pCont.webkitRequestFullscreen();
      }
      // Give the browser a beat to finish the fullscreen transition
      await new Promise(function(r){ setTimeout(r, 100); });
      try {
        if(screen.orientation && screen.orientation.lock){
          await screen.orientation.lock('landscape');
        }
      } catch(e){ /* desktop / unsupported — ignore */ }
    } catch(e){
      console.warn('Fullscreen failed:', e);
    }
  }
  syncFullscreenBtnState();
}

function syncFullscreenBtnState(){
  if(!currentPlayer || !currentPlayer.elements || !currentPlayer.elements.buttons) return;
  var btn = currentPlayer.elements.buttons.fullscreen;
  if(!btn) return;
  var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  btn.setAttribute('aria-pressed', fsEl ? 'true' : 'false');
  if(currentPlayer.elements.container){
    currentPlayer.elements.container.classList.toggle('plyr--fullscreen-active', !!fsEl);
  }
}

function handleFullscreenChange(){
  syncFullscreenBtnState();
  closeQualityMenu();
  var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  if(!fsEl){
    try {
      if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    } catch(e){}
  }
}
document.addEventListener('fullscreenchange', handleFullscreenChange);
document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

function bindQualityEvents(){
  if(!$qualityBtn) return;
  $qualityBtn.addEventListener('click', function(e){
    e.stopPropagation();
    $qualityMenu.classList.toggle('show');
    $qualityBtn.classList.toggle('open');
  });
}

function destroyPlayer(){
  if(retryTmr){ clearTimeout(retryTmr); retryTmr = null; }
  if(resumeTmr){ clearInterval(resumeTmr); resumeTmr = null; }

  if(currentAdsManager){ try{ currentAdsManager.destroy(); }catch(e){} currentAdsManager = null; }
  if(currentAdsLoader){ try{ currentAdsLoader.destroy(); }catch(e){} currentAdsLoader = null; }
  if(currentPlayer){ try{ currentPlayer.destroy(); }catch(e){} currentPlayer = null; }
  if(currentHls){ try{ currentHls.destroy(); }catch(e){} currentHls = null; }

  buildFreshPlayer();

  if(unmuteHandler){
    document.removeEventListener('click', unmuteHandler);
    document.removeEventListener('touchstart', unmuteHandler);
    unmuteHandler = null;
  }
}

function hidePlayer(){
  playToken++;

  // Exit fullscreen if we're in it
  try {
    var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if(fsEl){
      if(document.exitFullscreen) document.exitFullscreen().catch(function(){});
      else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
    if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
  } catch(e){}

  $pCont.style.display = 'none';
  $list.classList.add('visible');
  closeQualityMenu();
  destroyPlayer();
  if(window.history && window.history.pushState)
    window.history.pushState({}, document.title, window.location.pathname);
  document.title = 'SPORTLINK · Fancode Live';
}

/* ═══ QUALITY PICKER ═══ */
document.addEventListener('click', function(e){
  if($qualityWrap && $qualityWrap.classList.contains('show') && !$qualityWrap.contains(e.target)){
    closeQualityMenu();
  }
});

function closeQualityMenu(){
  if($qualityMenu) $qualityMenu.classList.remove('show');
  if($qualityBtn) $qualityBtn.classList.remove('open');
}

function updateQualityLabel(){
  if(!$qualityLabel) return;
  $qualityLabel.textContent = (currentQualityKey === 'auto') ? 'Auto' : currentQualityKey;
}

function renderQualityMenu(){
  if(!$qualityList) return;
  $qualityList.innerHTML = '';

  var order = ['1080p','720p','540p','480p','360p','240p','Auto'];
  var keys = Object.keys(currentQualities);
  keys.sort(function(a,b){
    var ai = order.indexOf(a), bi = order.indexOf(b);
    if(ai === -1) ai = 99;
    if(bi === -1) bi = 99;
    return ai - bi;
  });

  // Auto option
  var autoBtn = document.createElement('button');
  autoBtn.className = 'q-item' + (currentQualityKey === 'auto' ? ' active' : '');
  autoBtn.innerHTML = '<span>Auto</span><span class="q-auto">BEST</span>';
  autoBtn.onclick = function(){
    currentQualityKey = 'auto';
    updateQualityLabel();
    var best = bestQualityKey();
    if(best){
      var q = currentQualities[best];
      switchQuality(q.url, q.cookie, 'Auto');
    }
  };
  $qualityList.appendChild(autoBtn);

  // Individual qualities
  keys.forEach(function(k){
    if(k === 'Auto') return;
    var q = currentQualities[k];
    var btn = document.createElement('button');
    btn.className = 'q-item' + (currentQualityKey === k ? ' active' : '');
    btn.textContent = k;
    btn.onclick = function(){
      currentQualityKey = k;
      updateQualityLabel();
      switchQuality(q.url, q.cookie, k);
    };
    $qualityList.appendChild(btn);
  });

  updateQualityLabel();
}

/* ═══════════════════════════════════════════════════════════════
   switchQuality — REUSE the same Hls + Plyr instances.
   Only rebuild the whole stack as a last resort.
   ═══════════════════════════════════════════════════════════════ */
function switchQuality(url, cookie, label){
  closeQualityMenu();
  toast('Switching to ' + label + '…', 'warn', 2000);

  var streamUrl = url;
  if(cookie){
    streamUrl += (streamUrl.indexOf('?') === -1 ? '?' : '&') + 'hdntl_cookie=' + encodeURIComponent(cookie);
  }
  var playUrl = proxyUrl(streamUrl);
  var isM3U8 = /\.m3u8(\?|$)/i.test(url) || url.indexOf('.m3u8') !== -1;
  var token = playToken;

  // ── PATH 1: reuse existing Hls instance (fast, preserves Plyr UI) ──
  if(currentHls && isM3U8){
    try {
      currentHls.stopLoad();
      currentHls.detachMedia();

      currentHls.loadSource(playUrl);
      currentHls.attachMedia($video);

      currentHls.once(Hls.Events.MANIFEST_PARSED, function(){
        if(token !== playToken) return;
        try {
          if($video.duration && isFinite($video.duration)){
            $video.currentTime = Math.max(0, $video.duration - 2);
          }
        } catch(e){}
        var p = $video.play();
        if(p && p.catch) p.catch(function(){});
        toast('● ' + label, 'ok', 2000);
      });

      currentHls.on(Hls.Events.ERROR, function(_, data){
        if(token !== playToken) return;
        if(!data.fatal) return;
        if(data.type === Hls.ErrorTypes.NETWORK_ERROR) currentHls.startLoad();
        else if(data.type === Hls.ErrorTypes.MEDIA_ERROR) currentHls.recoverMediaError();
      });

      return;
    } catch(e){
      console.warn('Hls reuse failed, falling back to rebuild:', e);
    }
  }

  // ── PATH 2: full rebuild of Plyr + Hls (last resort) ──
  buildFreshPlayer();

  var hlsSupported = (typeof Hls !== 'undefined' && Hls.isSupported && Hls.isSupported());

  if(hlsSupported && isM3U8){
    var hls = new Hls({
      autoStartLoad:true, enableWorker:true, lowLatencyMode:true,
      backbufferLength:30, manifestLoadingTimeOut:20000, manifestLoadingMaxRetry:6,
      levelLoadingTimeOut:20000, fragLoadingTimeOut:30000
    });
    currentHls = hls;
    hls.loadSource(playUrl);
    hls.attachMedia($video);
    hls.on(Hls.Events.MANIFEST_PARSED, function(){
      if(token !== playToken) return;
      var p = $video.play();
      if(p && p.catch) p.catch(function(){});
      toast('● ' + label, 'ok', 2000);
    });
    hls.on(Hls.Events.ERROR, function(_, data){
      if(token !== playToken) return;
      if(!data.fatal) return;
      if(data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
      else if(data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
    });
  } else if($video.canPlayType('application/vnd.apple.mpegurl') && isM3U8){
    $video.src = playUrl;
    var p2 = $video.play();
    if(p2 && p2.catch) p2.catch(function(){});
    toast('● ' + label, 'ok', 2000);
  } else {
    $video.src = playUrl;
    var p3 = $video.play();
    if(p3 && p3.catch) p3.catch(function(){});
    toast('● ' + label, 'ok', 2000);
  }
}

/* ═══ AD PLAYBACK ═══ */
function playAdThenContent(url, name, cookie, token){
  var canRequest = VAST_TAG && window.google && google.ima && google.ima.AdsLoader;
  if(!canRequest){ startStream(url, cookie, token); return; }

  var adContainer = document.getElementById('ad-container');
  if(!adContainer){ startStream(url, cookie, token); return; }

  adContainer.classList.add('active');
  toast('Advertisement','warn',0);

  var done = false;
  var adTimer = null;

  function finish(){
    if(done) return;
    done = true;
    if(adTimer){ clearTimeout(adTimer); adTimer = null; }

    if(currentAdsManager){ try{ currentAdsManager.destroy(); }catch(e){} currentAdsManager = null; }
    if(currentAdsLoader){ try{ currentAdsLoader.destroy(); }catch(e){} currentAdsLoader = null; }

    var ac = document.getElementById('ad-container');
    if(ac){ ac.classList.remove('active'); try{ ac.innerHTML = ''; }catch(e){} }

    if(token !== playToken) return;
    startStream(url, cookie, token);
  }

  try {
    var displayContainer = new google.ima.AdDisplayContainer(adContainer, $video);
    displayContainer.initialize();

    var adsLoader = new google.ima.AdsLoader(displayContainer);
    currentAdsLoader = adsLoader;

    adsLoader.addEventListener(google.ima.AdsManagerLoadedEvent.Type.ADS_MANAGER_LOADED, function(e){
      if(done || token !== playToken){ finish(); return; }
      try {
        var mgr = e.getAdsManager($video, null);
        currentAdsManager = mgr;
        mgr.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR, finish);
        mgr.addEventListener(google.ima.AdEvent.Type.ALL_ADS_COMPLETED, finish);
        mgr.addEventListener(google.ima.AdEvent.Type.CONTENT_RESUME_REQUESTED, finish);
        mgr.addEventListener(google.ima.AdEvent.Type.SKIPPED, finish);
        mgr.init(window.innerWidth, window.innerHeight, google.ima.ViewMode.NORMAL);
        mgr.start();
      } catch(err){ finish(); }
    }, false);

    adsLoader.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR, finish, false);

    var req = new google.ima.AdsRequest();
    req.adTagUrl = VAST_TAG;
    req.linearAdSlotWidth  = window.innerWidth;
    req.linearAdSlotHeight = window.innerHeight;
    req.nonLinearAdSlotWidth  = window.innerWidth;
    req.nonLinearAdSlotHeight = Math.round(window.innerHeight * 0.2);

    adsLoader.requestAds(req);
  } catch(e){ finish(); return; }

  adTimer = setTimeout(finish, AD_TIMEOUT);
}

/* ═══ HLS STREAM (initial) ═══ */
function startStream(url, cookie, token){
  if(token !== playToken) return;

  var streamUrl = url;
  if(cookie){
    streamUrl += (streamUrl.indexOf('?') === -1 ? '?' : '&') + 'hdntl_cookie=' + encodeURIComponent(cookie);
  }

  var playUrl = proxyUrl(streamUrl);
  var isM3U8 = /\.m3u8(\?|$)/i.test(url) || url.indexOf('.m3u8') !== -1;

  function startPlayback(){
    if(token !== playToken) return;
    hideOverlay();
    toast('● Live','ok',3000);
  }

  function attachUnmute(){
    if(unmuteHandler){
      document.removeEventListener('click', unmuteHandler);
      document.removeEventListener('touchstart', unmuteHandler);
    }
    unmuteHandler = function(){
      try { $video.muted = false; $video.volume = 1; } catch(e){}
      document.removeEventListener('click', unmuteHandler);
      document.removeEventListener('touchstart', unmuteHandler);
      unmuteHandler = null;
    };
    document.addEventListener('click', unmuteHandler);
    document.addEventListener('touchstart', unmuteHandler);
  }

  var hlsSupported = (typeof Hls !== 'undefined' && Hls.isSupported && Hls.isSupported());

  if(hlsSupported && isM3U8){
    var hls = new Hls({
      autoStartLoad:true, enableWorker:true, lowLatencyMode:true,
      backbufferLength:30, manifestLoadingTimeOut:20000, manifestLoadingMaxRetry:6,
      levelLoadingTimeOut:20000, fragLoadingTimeOut:30000
    });
    currentHls = hls;

    hls.loadSource(playUrl);
    hls.attachMedia($video);

    hls.on(Hls.Events.MANIFEST_PARSED, function(){
      if(token !== playToken) return;
      var p = $video.play();
      if(p && p.catch) p.catch(function(){});
      hideOverlay();
      toast('● Live','ok',3000);
    });

    hls.on(Hls.Events.ERROR, function(_, data){
      if(token !== playToken) return;
      if(!data.fatal) return;

      toast('Reconnecting…','warn',0);
      if(retryTmr) clearTimeout(retryTmr);
      retryTmr = setTimeout(function(){
        retryTmr = null;
        if(token !== playToken) return;
        try {
          if(data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
          else if(data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
        } catch(e){}
      }, 2000);
    });

  } else if($video.canPlayType('application/vnd.apple.mpegurl') && isM3U8){
    $video.src = playUrl;
    $video.addEventListener('loadedmetadata', function onM(){
      $video.removeEventListener('loadedmetadata', onM);
      if(token !== playToken) return;
      startPlayback();
    });

  } else {
    $video.src = playUrl;
    startPlayback();
  }

  attachUnmute();

  if(resumeTmr) clearInterval(resumeTmr);
  var myResumeTmr = setInterval(function(){
    if(token !== playToken){ clearInterval(myResumeTmr); return; }
    if($video.paused && $video.readyState > 2){
      var p = $video.play();
      if(p && p.catch) p.catch(function(){});
    }
  }, 3000);
  resumeTmr = myResumeTmr;
}

/* ═══ ENTRY POINT ═══ */
function setupHLSPlayer(url, name, cookie, match){
  var token = ++playToken;

  currentMatchObj = match || null;
  currentQualityKey = 'auto';

  showPlayer();
  destroyPlayer();

  if(match){
    var info = getPlayable(match);
    var lang = info ? info.language : (match.language || '');
    currentQualities = buildQualities(match, lang);
  } else {
    currentQualities = {};
  }

  var keyCount = Object.keys(currentQualities).length;
  if(keyCount > 1){
    $qualityWrap.classList.add('show');
    renderQualityMenu();
  } else {
    $qualityWrap.classList.remove('show');
  }

  toast('Loading…','warn',0);
  playAdThenContent(url, name, cookie, token);
}

// ── ERROR ──
function errMsg(msg){
  setMsg(msg);
  $overlay.style.display = 'flex';
  toast(msg, 'err', 0);
  $list.classList.add('visible');
  if($qualityWrap) $qualityWrap.classList.remove('show');
}

// ── EVENTS ──
window.addEventListener('popstate', function(){
  if($pCont.style.display === 'flex') hidePlayer();
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && $pCont.style.display === 'flex') hidePlayer();
});

// ── MAIN ──
async function main(){
  var id = getMatchId();
  var matches;
  try {
    setMsg('Loading matches…');
    matches = await loadData();
  } catch(e){
    console.error(e);
    errMsg('Connection error: ' + e.message);
    return;
  }
  if(!id){ renderList(matches); return; }

  var m = matches.find(function(x){ return String(x.match_id) === String(id); });
  if(!m){ errMsg('Match not found.'); return; }

  var info = getPlayable(m);
  if(!info){ errMsg('Stream not available for this match yet.'); return; }

  document.title = 'SPORTLINK · ' + m.title;
  renderList(matches);
  setupHLSPlayer(info.url, m.title, info.cookie, m);
}

document.addEventListener('DOMContentLoaded', main);
})();
</script>
