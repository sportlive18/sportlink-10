<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Join @sportlink10</title>
<link rel="icon" href="/sportlink.png">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SMZXC121E6"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-SMZXC121E6');
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:#0a0a0f;font-family:'Segoe UI',sans-serif;overflow:hidden;}

#main-iframe{width:100%;height:100%;border:none;display:block;position:absolute;top:0;left:0;}

/* ---- SINGLE TELEGRAM BADGE (only one) ---- */
.tg-badge{
  position:absolute;top:15px;left:15px;z-index:9999;
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,#1e88e5,#1565c0);
  padding:9px 18px;border-radius:12px;
  text-decoration:none;color:#fff;font-size:15px;font-weight:600;
  box-shadow:0 4px 14px rgba(0,0,0,0.5);
  transition:transform .2s,box-shadow .2s;
  border:1px solid rgba(255,255,255,0.15);
}
.tg-badge:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(30,136,229,0.4);}
.tg-badge-icon{
  width:30px;height:30px;background:rgba(255,255,255,0.15);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:2px solid #fff;flex-shrink:0;
}
.tg-badge-icon svg{width:17px;height:17px;fill:#fff;}
.tg-badge span{white-space:nowrap;}

/* ---- PICKER ---- */
#picker{position:absolute;inset:0;overflow-y:auto;background:#0a0a0f;display:none;}

.picker-header{
  position:sticky;top:0;z-index:10;
  background:linear-gradient(180deg,#0a0a0f 80%,transparent);
  padding:20px 16px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.picker-title{color:#fff;font-size:20px;font-weight:700;letter-spacing:.5px;flex-shrink:0;}
.picker-title span{color:#1e88e5;}

.picker-links{display:flex;align-items:center;gap:8px;flex-shrink:0;}

.tg-link{
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,#1e88e5,#1565c0);
  padding:8px 13px;border-radius:10px;
  text-decoration:none;color:#fff;font-size:13px;font-weight:600;
}
.tg-link svg{width:15px;height:15px;fill:#fff;}

.search-bar{padding:0 16px 12px;}
.search-bar input{
  width:100%;background:#1a1a2e;border:1px solid #2a2a40;
  border-radius:10px;padding:10px 14px;color:#fff;font-size:14px;outline:none;
}
.search-bar input::placeholder{color:#555;}
.search-bar input:focus{border-color:#1e88e5;}

.channel-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;padding:0 16px 24px;
}
.channel-card{
  background:#141420;border:1px solid #1e1e30;border-radius:12px;
  padding:12px;cursor:pointer;
  transition:background .15s,border-color .15s,transform .1s;
  display:flex;align-items:center;gap:10px;text-decoration:none;
}
.channel-card:active{transform:scale(.97);}
.channel-card:hover{background:#1a1a2e;border-color:#1e88e5;}

.channel-logo{
  width:36px;height:36px;border-radius:9px;object-fit:cover;
  background:#1e1e30;flex-shrink:0;display:block;
}
.channel-dot{
  width:10px;height:10px;border-radius:50%;background:#1e88e5;flex-shrink:0;
  box-shadow:0 0 6px #1e88e5;margin:0 13px 0 13px;
}
.channel-info{min-width:0;display:flex;flex-direction:column;gap:3px;}
.channel-name{
  color:#e0e0e0;font-size:13px;font-weight:500;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;
}
.channel-cat{color:#4a6fa5;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
.no-results{color:#444;text-align:center;padding:40px 16px;font-size:14px;grid-column:1/-1;}

/* ---- TELEGRAM POPUP (unchanged) ---- */
#tgOverlay {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  display: none; align-items: center; justify-content: center;
  z-index: 999999; padding: 20px;
  animation: fadeInPopup 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
}
#tgOverlay.show { display: flex; }
#tgCard {
  width: 100%; max-width: 400px;
  background: linear-gradient(160deg, #121821, #0a0c0f);
  border: 1px solid rgba(79, 195, 247, 0.15);
  border-radius: 24px; padding: 36px 28px 28px;
  box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8);
  text-align: center; position: relative; overflow: hidden;
}
#tgCard::before {
  content: ""; position: absolute; top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(circle at 30% 20%, rgba(79, 195, 247, 0.04), transparent 60%);
  pointer-events: none;
}
#tgIcon {
  width: 72px; height: 72px; margin: 0 auto 16px;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #2AABEE, #229ED9);
  box-shadow: 0 0 40px rgba(42, 171, 238, 0.2);
  position: relative; z-index: 1;
}
#tgIcon svg { width: 36px; height: 36px; }
#tgCard h2 {
  margin: 0 0 8px; font-size: clamp(1.3rem, 2.5vw, 1.8rem);
  font-weight: 700; color: #ffffff; font-family: 'Segoe UI', system-ui, sans-serif;
  position: relative; z-index: 1;
}
#tgCard p {
  margin: 0 0 24px; color: #8e9baf;
  font-size: clamp(0.9rem, 1.2vw, 1.05rem); line-height: 1.6;
  position: relative; z-index: 1;
}
.tgBtns { display: flex; gap: 12px; position: relative; z-index: 1; }
.tgBtn {
  flex: 1; height: 48px; border-radius: 40px;
  font-weight: 700; font-size: clamp(0.85rem, 1vw, 1rem);
  cursor: pointer; transition: all 0.25s ease; border: none;
  font-family: 'Segoe UI', system-ui, sans-serif;
}
#joinNow { background: linear-gradient(135deg, #4fc3f7, #2196f3); color: #ffffff; box-shadow: 0 6px 24px rgba(79, 195, 247, 0.25); }
#joinNow:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(79, 195, 247, 0.35); }
#joinedBtn { background: rgba(255, 255, 255, 0.05); color: #8e9baf; border: 1px solid rgba(255, 255, 255, 0.08); }
#joinedBtn:hover { background: rgba(255, 255, 255, 0.08); color: #ffffff; }
@keyframes fadeInPopup {
  from { opacity: 0; transform: scale(0.95) translateY(12px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
@media (max-width: 480px) {
  #tgCard { padding: 24px 18px 20px; border-radius: 20px; }
  #tgIcon { width: 60px; height: 60px; }
  #tgIcon svg { width: 30px; height: 30px; }
  #tgCard h2 { font-size: 1.2rem; }
  #tgCard p { font-size: 0.85rem; margin-bottom: 18px; }
  .tgBtn { height: 42px; font-size: 0.8rem; }
}
</style>
</head>
<body>

<!-- ✅ SINGLE TELEGRAM BADGE → @sportlink10 -->
<a class="tg-badge" href="https://t.me/sportlink10" target="_blank" rel="noopener">
  <div class="tg-badge-icon">
    <svg viewBox="0 0 24 24"><path d="M9.993 15.674l-.398 5.604c.57 0 .817-.245 1.113-.54l2.67-2.557 5.53 4.047c1.014.558 1.734.264 1.987-.939l3.6-16.86.001-.001c.3-1.4-.506-1.95-1.496-1.58L1.27 9.64c-1.37.53-1.35 1.29-.233 1.64l5.68 1.77L19.29 5.73c.59-.39 1.13-.175.69.215"/></svg>
  </div>
  <span>Join @sportlink10</span>
</a>

<iframe id="main-iframe" allowfullscreen allow="encrypted-media; fullscreen; autoplay"></iframe>

<div id="picker">
  <div class="picker-header">
    <div class="picker-title">⚡ <span>Live</span> Channels</div>
    <div class="picker-links">
      <!-- Telegram link → @sportlink10 -->
      <a href="https://t.me/sportlink10" target="_blank" class="tg-link">
        <svg viewBox="0 0 24 24"><path d="M9.993 15.674l-.398 5.604c.57 0 .817-.245 1.113-.54l2.67-2.557 5.53 4.047c1.014.558 1.734.264 1.987-.939l3.6-16.86.001-.001c.3-1.4-.506-1.95-1.496-1.58L1.27 9.64c-1.37.53-1.35 1.29-.233 1.64l5.68 1.77L19.29 5.73c.59-.39 1.13-.175.69.215"/></svg>
        @sportlink10
      </a>
    </div>
  </div>
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="Search channels…" autocomplete="off">
  </div>
  <div class="channel-grid" id="channel-grid"></div>
</div>

<!-- Telegram Popup -->
<div id="tgOverlay">
  <div id="tgCard">
    <div id="tgIcon">
      <svg viewBox="0 0 24 24" fill="white" width="36" height="36">
        <path d="M23.05 2.1L19.6 21.3c-.26 1.15-.94 1.43-1.9.9l-5.26-3.88-2.54 2.45c-.28.28-.52.52-1.06.52l.38-5.4L19.9 5.8c.46-.4-.1-.63-.72-.23L7.5 13.03l-5.24-1.64c-1.14-.36-1.16-1.14.24-1.68L21.6.9c.95-.36 1.78.23 1.45 1.2z"/>
      </svg>
    </div>
    <h2>SportLink</h2>
    <p>Get match links &amp; live updates delivered straight to your phone.</p>
    <div class="tgBtns">
      <button class="tgBtn" id="joinedBtn">Already Joined</button>
      <button class="tgBtn" id="joinNow">Join Now</button>
    </div>
  </div>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const JSON_URL = 'https://sportlink-json.pages.dev/id.json';

  const urlParams   = new URLSearchParams(window.location.search);
  const id          = urlParams.get('id');
  const iframe      = document.getElementById('main-iframe');
  const picker      = document.getElementById('picker');

  function normalise(raw) {
    if (Array.isArray(raw)) return raw;
    if (!raw || typeof raw !== 'object') return [];
    if (Array.isArray(raw.channels)) return raw.channels;
    if (Array.isArray(raw.iframes))  return raw.iframes;
    if (Array.isArray(raw.data))     return raw.data;
    return [raw];
  }

  if (id) {
    fetch(JSON_URL)
      .then(res => res.json())
      .then(raw => {
        const list = normalise(raw);
        const targetData = list.find(item => String(item.id) === String(id));

        if (targetData && targetData.iframeSrc) {
          iframe.src = targetData.iframeSrc;
          if (targetData.hit) fetch(targetData.hit).catch(() => {});
        } else {
          showPickerMode(list);
        }
      })
      .catch(err => {
        console.error("Fetch error:", err);
        showError("Error loading data");
      });
  } else {
    iframe.style.display = 'none';
    fetch(JSON_URL)
      .then(res => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(raw => {
        console.log("Loaded channels:", raw);
        showPickerMode(normalise(raw));
      })
      .catch(err => {
        console.error("Fetch error:", err);
        showError("Error loading channels");
      });
  }

  function showPickerMode(channels) {
    iframe.style.display = 'none';
    picker.style.display = 'block';
    renderChannels(channels);

    document.getElementById('search-input').addEventListener('input', e => {
      const q = e.target.value.trim().toLowerCase();
      renderChannels(channels.filter(c =>
        (c.name || '').toLowerCase().includes(q) ||
        (c.category || '').toLowerCase().includes(q)
      ));
    });
  }

  function renderChannels(channels) {
    const grid = document.getElementById('channel-grid');
    grid.innerHTML = '';

    if (!channels.length) {
      const empty = document.createElement('div');
      empty.className = 'no-results';
      empty.textContent = 'No channels found';
      grid.appendChild(empty);
      return;
    }

    const seen = new Set();

    channels.forEach(ch => {
      const name = ch.name || 'Unnamed';
      if (seen.has(name)) return;
      seen.add(name);

      const card = document.createElement('a');
      card.className = 'channel-card';
      card.href = '?id=' + encodeURIComponent(ch.id);

      if (ch.logourl) {
        const img = document.createElement('img');
        img.className = 'channel-logo';
        img.src = ch.logourl;
        img.alt = '';
        img.loading = 'lazy';
        img.onerror = () => {
          const dot = document.createElement('div');
          dot.className = 'channel-dot';
          img.replaceWith(dot);
        };
        card.appendChild(img);
      } else {
        const dot = document.createElement('div');
        dot.className = 'channel-dot';
        card.appendChild(dot);
      }

      const info = document.createElement('div');
      info.className = 'channel-info';

      const nameEl = document.createElement('div');
      nameEl.className = 'channel-name';
      nameEl.textContent = name;
      info.appendChild(nameEl);

      if (ch.category) {
        const catEl = document.createElement('div');
        catEl.className = 'channel-cat';
        catEl.textContent = ch.category;
        info.appendChild(catEl);
      }

      card.appendChild(info);
      grid.appendChild(card);
    });
  }

  function showError(msg) {
    iframe.style.display = 'none';
    picker.style.display = 'block';
    const grid = document.getElementById('channel-grid');
    grid.innerHTML = '<div class="no-results">' + msg + '</div>';
  }
});
</script>

<script>
(function () {
  const tgOverlay = document.getElementById('tgOverlay');
  function closePopup() { tgOverlay.classList.remove('show'); }
  setTimeout(function () { tgOverlay.classList.add('show'); }, 3000);
  document.getElementById('joinNow').onclick = function () {
    window.open('https://t.me/sportlink10', '_blank');
    closePopup();
  };
  document.getElementById('joinedBtn').onclick = function () { closePopup(); };
  tgOverlay.addEventListener('click', function (e) {
    if (e.target === tgOverlay) closePopup();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && tgOverlay.classList.contains('show')) closePopup();
  });
})();
</script>
</body>
</html>
