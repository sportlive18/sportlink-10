<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>🔴 SportLink • Pokémon Player</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html, body { width:100%; height:100%; background:#000; overflow:hidden; font-family:'Inter',sans-serif; user-select:none; -webkit-user-select:none; }
        .player-shell { position:absolute; inset:0; background:#000; }
        .video-area { position:absolute; inset:0; background:#000; cursor:pointer; -webkit-tap-highlight-color:transparent; outline:none; }
        #video { position:absolute; inset:0; width:100%!important; height:100%!important; object-fit:contain; background:#000; display:block; outline:none; }
        button:focus, a:focus, #video:focus { outline:none; }

        #back-btn {
            position:fixed; top:14px; left:14px; z-index:9999;
            background:rgba(0,0,0,0.55); border:1px solid rgba(255,255,255,0.12);
            color:rgba(255,255,255,0.9); padding:7px 15px; border-radius:8px;
            font-size:12px; font-weight:700; cursor:pointer; text-decoration:none;
            backdrop-filter:blur(8px); transition:0.2s;
        }
        #back-btn:hover { background:rgba(0,0,0,0.8); }

        /* Bottom bar */
        .bottom-bar {
            position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
            z-index:30; width:calc(100% - 28px); max-width:860px;
            display:flex; flex-direction:column; gap:8px;
            transition:opacity 0.4s, transform 0.4s;
        }
        .hide-controls .bottom-bar { opacity:0; transform:translateX(-50%) translateY(16px); pointer-events:none; }

        /* Progress */
        .progress-track { width:100%; height:20px; display:flex; align-items:center; cursor:pointer; padding:6px 0; }
        .progress-rail { width:100%; height:3px; background:rgba(255,255,255,0.2); border-radius:99px; position:relative; transition:height 0.12s; }
        .progress-track:hover .progress-rail { height:5px; }
        .progress-filled { position:absolute; left:0; top:0; height:100%; background:#fff; border-radius:99px; pointer-events:none; }
        .progress-thumb { position:absolute; top:50%; width:12px; height:12px; background:#fff; border-radius:50%; transform:translate(-50%,-50%) scale(0); pointer-events:none; box-shadow:0 2px 8px rgba(0,0,0,0.4); transition:transform 0.12s; }
        .progress-track:hover .progress-thumb { transform:translate(-50%,-50%) scale(1); }

        /* Controls pill */
        .pill-bar {
            width:100%; background:rgba(28,28,32,0.85); backdrop-filter:blur(40px) saturate(180%);
            border:1px solid rgba(255,255,255,0.08); border-radius:22px;
            padding:6px 10px; display:flex; align-items:center; gap:3px;
            box-shadow:0 8px 32px rgba(0,0,0,0.4);
        }
        .ctrl-btn { background:none; border:none; width:38px; height:38px; display:grid; place-items:center; cursor:pointer; color:rgba(255,255,255,0.9); border-radius:50%; transition:all 0.12s; }
        .ctrl-btn:hover { background:rgba(255,255,255,0.1); }
        .ctrl-btn:active { transform:scale(0.9); }
        .ctrl-btn svg { width:20px; height:20px; }
        .time-label { font-size:11px; font-weight:600; color:rgba(255,255,255,0.65); font-variant-numeric:tabular-nums; padding:0 6px; user-select:none; }
        .spacer { flex:1; }

        /* Quality menu */
        .menu-wrap { position:relative; }
        .quality-popup {
            position:absolute; bottom:calc(100% + 10px); right:0;
            background:rgba(28,28,32,0.95); backdrop-filter:blur(40px);
            border:1px solid rgba(255,255,255,0.08); border-radius:16px;
            padding:5px; min-width:110px; z-index:40;
            box-shadow:0 12px 40px rgba(0,0,0,0.5);
            transform-origin:bottom right; transition:all 0.2s;
            opacity:0; pointer-events:none; transform:scale(0.85);
        }
        .quality-popup.open { opacity:1; pointer-events:auto; transform:scale(1); }
        .q-item {
            padding:9px 14px; border-radius:10px; cursor:pointer; font-size:13px; font-weight:600;
            color:rgba(255,255,255,0.55); transition:all 0.1s; display:flex; align-items:center; justify-content:space-between;
        }
        .q-item:hover { background:rgba(255,255,255,0.08); color:#fff; }
        .q-item.active { color:#fff; background:rgba(255,255,255,0.08); }
        .q-item.active::after { content:'✓'; font-size:13px; margin-left:6px; }

        /* Center flash */
        .center-flash { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:15; pointer-events:none; opacity:0; transition:opacity 0.2s; }
        .center-flash.show { opacity:1; }
        .center-circle { width:66px; height:66px; background:rgba(0,0,0,0.4); backdrop-filter:blur(16px); border-radius:50%; display:grid; place-items:center; transform:scale(0.6); transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1); }
        .center-flash.show .center-circle { transform:scale(1); }
        .center-circle svg { width:28px; height:28px; color:#fff; }

        /* Loading */
        #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; z-index:100; transition:opacity 0.3s; }
        #loading.hidden { opacity:0; pointer-events:none; }
        .spinner { width:40px; height:40px; border:3px solid rgba(255,255,255,0.1); border-top-color:#6366f1; border-radius:50%; animation:spin 0.8s linear infinite; }
        @keyframes spin { to{transform:rotate(360deg)} }
        #error-msg { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:rgba(239,68,68,0.9); color:#fff; padding:7px 16px; border-radius:8px; font-size:12px; display:none; z-index:200; }
        .hidden { display:none!important; }

        @media(max-width:640px) { .ctrl-btn{width:34px;height:34px} .ctrl-btn svg{width:18px;height:18px} .pill-bar{padding:5px 7px;border-radius:18px} .bottom-bar{bottom:10px;width:calc(100%-14px)} }
        /* SportLink Pokémon theme */
        #brand-badge {
            position:fixed; top:14px; left:135px; z-index:9999;
            display:flex; align-items:center; gap:8px; padding:7px 12px;
            color:#fff; background:rgba(18,22,32,.86);
            border:1px solid rgba(255,255,255,.16); border-radius:10px;
            font-size:11px; font-weight:900; letter-spacing:1.2px;
            backdrop-filter:blur(12px); box-shadow:0 4px 16px rgba(0,0,0,.35);
        }
        .pokeball-mark {
            position:relative; display:inline-block; width:17px; height:17px;
            border:2px solid #fff; border-radius:50%; overflow:hidden;
            background:linear-gradient(to bottom,#ef4444 0 46%,#fff 46% 100%);
        }
        .pokeball-mark::before { content:""; position:absolute; left:0; right:0; top:6px; height:2px; background:#111; }
        .pokeball-mark::after { content:""; position:absolute; width:5px; height:5px; left:4px; top:4px; border:1.5px solid #111; border-radius:50%; background:#fff; }
        .pokemon-tag { color:#ffd84d; font-size:9px; letter-spacing:1px; }
        @media(max-width:420px) { #brand-badge { left:auto; right:14px; top:54px; } }
    </style>
</head>
<body>
    <div id="loading"><div class="spinner"></div></div>
    <a href="index.html" id="back-btn">← Back to Hub</a>
    <div id="brand-badge" aria-label="SportLink Pokémon Player"><span class="pokeball-mark" aria-hidden="true"></span><span>SPORTLINK</span><span class="pokemon-tag">POKÉMON</span></div>
    <div id="top-lang-bar" style="position:fixed;top:14px;right:14px;z-index:9999;display:none;background:rgba(20,20,25,0.8);border:1px solid rgba(255,255,255,0.15);padding:4px 8px;border-radius:10px;backdrop-filter:blur(12px);align-items:center;gap:6px;">
        <span style="font-size:11px;color:rgba(255,255,255,0.75);font-weight:700;">🎙️ Audio:</span>
        <div id="top-lang-buttons" style="display:flex;align-items:center;gap:4px;"></div>
    </div>

    <div class="player-shell">
        <div id="video-area" class="video-area">
            <video id="video" autoplay muted playsinline webkit-playsinline referrerpolicy="no-referrer"></video>

            <div id="center-flash" class="center-flash">
                <div class="center-circle">
                    <svg id="c-play" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="c-pause" fill="currentColor" viewBox="0 0 24 24" class="hidden"><rect x="6" y="4" width="4" height="16" rx="1.5"/><rect x="14" y="4" width="4" height="16" rx="1.5"/></svg>
                </div>
            </div>

            <div id="bottom-bar" class="bottom-bar">
                <div id="prog-track" class="progress-track">
                    <div class="progress-rail">
                        <div id="prog-filled" class="progress-filled" style="width:0"></div>
                        <div id="prog-thumb" class="progress-thumb" style="left:0"></div>
                    </div>
                </div>
                <div class="pill-bar">
                    <button id="play-btn" class="ctrl-btn" title="Play/Pause">
                        <svg id="i-play" fill="currentColor" viewBox="0 0 24 24" class="hidden"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="i-pause" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1.5"/><rect x="14" y="4" width="4" height="16" rx="1.5"/></svg>
                    </button>
                    <button id="mute-btn" class="ctrl-btn" title="Mute (M)">
                        <svg id="i-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
                        <svg id="i-unmuted" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="hidden"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 010 7.07"/><path d="M19.07 4.93a10 10 0 010 14.14"/></svg>
                    </button>
                    <span class="time-label"><span id="cur-time">0:00</span></span>
                    <div class="spacer"></div>
                    <div class="menu-wrap" style="display:flex;align-items:center;gap:4px;">
                        <span id="q-badge" style="font-size:11px;font-weight:700;color:rgba(255,255,255,0.8);background:rgba(255,255,255,0.1);padding:3px 8px;border-radius:8px;cursor:pointer;">Auto</span>
                        <button id="q-btn" class="ctrl-btn" title="Quality">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
                        </button>
                        <div id="q-menu" class="quality-popup"></div>
                    </div>
                    <button id="share-btn" class="ctrl-btn" title="Share Match">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:17px;height:17px;"><path stroke-linecap="round" stroke-linejoin="round" d="M8.684 10.742l4.636-2.318M8.684 13.258l4.636 2.318m6-4.576a3 3 0 11-6 0 3 3 0 016 0zm-6-5.736a3 3 0 11-6 0 3 3 0 016 0zm0 11.472a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                    </button>
                    <button id="fs-btn" class="ctrl-btn" title="Fullscreen">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div id="error-msg"></div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@5.2.4/dist/shaka-player.compiled.js"></script>
    <script>
    (function() {
        // Single match-data source. Stream proxy configuration below is intentionally retained.
        var JSON_API = "https://sportlink-fancode10.pages.dev/fan.json";
        var params = new URLSearchParams(location.search);
        var matchId = params.get("id") || "";
        var reqRes = params.get("r") || "Auto";

        function cleanStreamUrl(value) {
            return String(value || "").trim().split("|")[0].trim().replace(/[,\s]+$/g, "");
        }

        

        var PROXIES = [
            "https://stream-through-spark.lovable.app/api/proxy?u=",
            "https://asp1.lovable.app/api/proxy?u="
        ];
        var currentProxyIdx = 0;

        function isValidStreamUrl(u) {
            var s = cleanStreamUrl(u);
            if (!s || !/^https?:\/\//i.test(s)) return false;
            if (/unavailable|null|undefined/i.test(s)) return false;
            return isUrlNotExpired(s);
        }

        function isDirectCorsHost(u) {
            return /in-mc-vod\.fancode\.com|dai-fancode\.pages\.dev/i.test(String(u || ""));
        }

        function unwrapProxiedUrl(u) {
            var cur = cleanStreamUrl(u);
            var guard = 0;
            while (guard++ < 4 && cur) {
                var m = cur.match(/https?:\/\/[^/]+(?:\/api)?(?:\/public)?\/(?:proxy|px)(?:\/[^?]*)?\?(?:u|url)=(.+)$/i);
                if (!m) break;
                try {
                    cur = cleanStreamUrl(decodeURIComponent(m[1]));
                } catch (_) {
                    cur = cleanStreamUrl(m[1]);
                }
            }
            return cur;
        }

        function toProxiedUrl(u, pIdx) {
            if (!u) return "";
            var clean = unwrapProxiedUrl(u);
            var px = PROXIES[typeof pIdx === 'number' ? pIdx : currentProxyIdx] || PROXIES[0];
            return px + encodeURIComponent(clean);
        }
var rawUrl = cleanStreamUrl(params.get("url") || params.get("play") || "");
        var streamUrl = "";
        var availableQualities = [];
        var currentRes = "";
        var selectedLevel = -1;

        var video = document.getElementById("video");
        var $loading = document.getElementById("loading");
        var $error = document.getElementById("error-msg");
        var videoArea = document.getElementById("video-area");
        var hlsInstance = null;
        var isDragging = false, controlsTimer = null, isQMenuOpen = false;

        function showError(msg, allowRetry) {
            $error.innerHTML = "";
            var span = document.createElement("span");
            span.textContent = msg;
            $error.appendChild(span);
            if (allowRetry) {
                var btn = document.createElement("button");
                btn.textContent = "Retry";
                btn.style.cssText = "margin-left:10px;background:#fff;color:#ef4444;border:none;border-radius:6px;padding:3px 10px;font-weight:800;font-size:11px;cursor:pointer;";
                btn.onclick = function(e) {
                    e.stopPropagation();
                    $error.style.display = "none";
                    if (lastPlayArgs) playStream.apply(null, lastPlayArgs);
                    else location.reload();
                };
                $error.appendChild(btn);
            }
            $error.style.display = "block";
            if (!allowRetry) setTimeout(function(){ $error.style.display = "none"; }, 6000);
        }
        function hideLoading() { $loading.classList.add("hidden"); setTimeout(function(){$loading.style.display="none"},300); }
        function showLoading() { $loading.style.display="flex"; $loading.classList.remove("hidden"); }

        function decodeHex(hex) {
            if (!hex) return "";
            var str = "";
            for (var i = 0; i < hex.length; i += 2) {
                str += String.fromCharCode(parseInt(hex.substr(i, 2), 16));
            }
            return str;
        }

        function findLevelIndex(levels, targetRes) {
            if (!targetRes || targetRes === "Auto" || targetRes === "auto") return -1;
            var targetH = parseInt(String(targetRes).replace("p", ""));
            if (!targetH || isNaN(targetH)) return -1;
            if (!levels || !levels.length) return -1;

            var exact = levels.findIndex(function(l) { return l.height === targetH; });
            if (exact !== -1) return exact;

            var closest = 0;
            var minDiff = Math.abs((levels[0].height || 0) - targetH);
            for (var i = 1; i < levels.length; i++) {
                const diff = Math.abs((levels[i].height || 0) - targetH);
                if (diff < minDiff) {
                    minDiff = diff;
                    closest = i;
                }
            }
            return closest;
        }

        function extractM3u8Qualities(text, baseStream) {
            if (!text) return [];
            var lines = text.split("\n");
            var list = [];
            var seen = {};
            for (var i = 0; i < lines.length; i++) {
                if (lines[i].includes("RESOLUTION=")) {
                    var resPart = lines[i].split("RESOLUTION=")[1].split(",")[0];
                    var height = resPart.split("x")[1];
                    var nextLine = "";
                    for (var j = i + 1; j < lines.length; j++) {
                        var candidate = lines[j].trim();
                        if (candidate && !candidate.startsWith("#")) {
                            nextLine = candidate;
                            break;
                        }
                    }
                    var streamUrl = cleanStreamUrl(nextLine);
                    if (streamUrl && !streamUrl.startsWith("http") && baseStream) {
                        try {
                            var baseUrl = new URL(baseStream);
                            var pathDir = baseUrl.pathname.substring(0, baseUrl.pathname.lastIndexOf("/") + 1);
                            streamUrl = baseUrl.origin + pathDir + streamUrl;
                        } catch (_) {}
                    }
                    var resLabel = height + "p";
                    if (streamUrl && streamUrl.startsWith("http") && !seen[resLabel]) {
                        seen[resLabel] = true;
                        list.push({ res: resLabel, url: cleanStreamUrl(streamUrl), targetRes: resLabel });
                    }
                }
            }
            return list;
        }

        
        function cleanKey(k) {
            if (!k) return '';
            var s = String(k).trim().toLowerCase().replace(/-/g, '');
            if (s.length === 32) return s;
            try {
                var b64 = k.replace(/-/g, '+').replace(/_/g, '/');
                while (b64.length % 4) b64 += '=';
                var bin = atob(b64);
                var hex = '';
                for (var i = 0; i < bin.length; i++) {
                    var h = bin.charCodeAt(i).toString(16);
                    hex += (h.length === 1 ? '0' : '') + h;
                }
                return hex;
            } catch(e) {
                return s;
            }
        }

        function isUrlNotExpired(url) {
            var m = String(url || "").match(/Expires=(\d+)/i);
            if (!m) return true;
            var exp = parseInt(m[1], 10);
            return !exp || (exp * 1000 > Date.now() + 60000);
        }

        function parseMatchQualities(m) {
            var standardRes = ["1080p", "720p", "540p", "480p", "360p", "240p"];
            var kajjuStreams = (m.streams && typeof m.streams === "object") ? m.streams : {};
            var autoStreamsMap = (m.auto_streams && typeof m.auto_streams === "object" && !Array.isArray(m.auto_streams)) ? m.auto_streams : {};
            var autoLangKey = Object.keys(autoStreamsMap).find(function(k) {
                return m.language && k.toLowerCase().indexOf(String(m.language).toLowerCase().slice(0, 3)) !== -1;
            }) || Object.keys(autoStreamsMap)[0];
            var autoLangStreams = (autoLangKey && autoStreamsMap[autoLangKey] && autoStreamsMap[autoLangKey].streams) ? autoStreamsMap[autoLangKey].streams : {};
            var baseStream = [
                m.dai_url,
                m.adfree_url,
                m.stream_url,
                kajjuStreams.primary,
                autoLangStreams["1080p"],
                autoLangStreams["720p"],
                kajjuStreams.fancode_cdn
            ].map(cleanStreamUrl).find(function(u) { return isValidStreamUrl(u); }) || "";

            // Check DRM
            var cdn = m.STREAMING_CDN || {};
            if (cdn.is_drm && cdn.drm && cdn.drm.clearkey) {
                var parts = cdn.drm.clearkey.split(":");
                var kid = parts[0], key = parts[1];
                var url = cleanStreamUrl(cdn.Primary_Playback_URL || baseStream || "");
                if (url) {
                    var drmList = [];
                    standardRes.forEach(function(r) {
                        drmList.push({ res: r, targetRes: r, url: url, isDrm: true, kid: kid, key: key });
                    });
                    drmList.push({ res: "Auto", targetRes: "Auto", url: url, isDrm: true, kid: kid, key: key });
                    return drmList;
                }
            } else if (baseStream && baseStream.indexOf(".mpd") !== -1) {
                var kid = m.kid || "";
                var key = m.key || "";
                var drmList = [];
                standardRes.forEach(function(r) {
                    drmList.push({ res: r, targetRes: r, url: baseStream, isDrm: true, kid: kid, key: key });
                });
                drmList.push({ res: "Auto", targetRes: "Auto", url: baseStream, isDrm: true, kid: kid, key: key });
                return drmList;
            }

            // Check google_m3u8_hex / m3u8_hex AND resolved M3U master playlist
            var hexData = m.google_m3u8_hex || m.m3u8_hex || m.hex || "";
            var hexQualities = hexData ? extractM3u8Qualities(decodeHex(hexData), cleanStreamUrl(m.json_dai_url || baseStream)) : [];
            var m3uQualities = m.master_m3u8 ? extractM3u8Qualities(m.master_m3u8, baseStream) : [];

            var autoObjList = [];
            standardRes.forEach(function(r) {
                if (autoLangStreams[r] && isUrlNotExpired(autoLangStreams[r])) {
                    autoObjList.push({ res: r, url: cleanStreamUrl(autoLangStreams[r]), targetRes: r });
                }
            });

            var useHexPrimary = hexQualities.length > 0 && isUrlNotExpired(hexQualities[0].url);
            var primaryList = useHexPrimary ? hexQualities : (m3uQualities.length > 0 ? m3uQualities : (autoObjList.length > 0 ? autoObjList : hexQualities));
            var secondaryList = useHexPrimary ? (m3uQualities.length > 0 ? m3uQualities : autoObjList) : (autoObjList.length > 0 ? autoObjList : hexQualities);

            if (primaryList.length > 0) {
                primaryList.forEach(function(q) {
                    var alt = secondaryList.find(function(s) { return s.res === q.res; });
                    if (alt && alt.url !== q.url && isValidStreamUrl(alt.url)) q.fallbackUrl = alt.url;
                    else if (isValidStreamUrl(kajjuStreams.fancode_cdn) && cleanStreamUrl(kajjuStreams.fancode_cdn) !== q.url) q.fallbackUrl = cleanStreamUrl(kajjuStreams.fancode_cdn);
                });
                return primaryList;
            }

            // Fallback to baseStream
            if (baseStream && isValidStreamUrl(baseStream)) {
                var list = [];
                var validFallback = isValidStreamUrl(kajjuStreams.fancode_cdn) ? cleanStreamUrl(kajjuStreams.fancode_cdn) : undefined;
                standardRes.forEach(function(r) {

                    }
                    list.push({ res: r, url: qUrl, targetRes: r, fallbackUrl: validFallback });
                });

            return [];

        var shakaInstance = null;

        function buildShakaQMenu(desired) {

                }
            });

            var heights = Object.keys(heightMap).map(Number).sort(function(a, b){ return b - a; });
            var items = [{ name: "Auto", height: 0, track: null }];
            heights.forEach(function(h) {
                items.push({ name: h + "p", height: h, track: heightMap[h] });
            });

                    currentRes = activeName;
                    shakaInstance.configure({ abr: { enabled: false } });
                    shakaInstance.selectVariantTrack(heightMap[matchTrack], true);
                }

            qMenu.innerHTML = "";
            items.forEach(function(it) {

        function playDrmStream(rawUrl, kid, key, targetRes) {
            showLoading();
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            if (shakaInstance) { shakaInstance.destroy(); shakaInstance = null; }

            shaka.polyfill.installAll();
            if (!shaka.Player.isBrowserSupported()) {
                hideLoading();
                showError("Browser does not support DRM DASH playback.");
                return;
            }

            var cleanMpd = unwrapProxiedUrl(rawUrl);
            var baseMpdUrl = cleanMpd.substring(0, cleanMpd.lastIndexOf("/") + 1);
            var proxiedMpd = toProxiedUrl(cleanMpd, currentProxyIdx);
            var drmRetryCount = 0;

            shakaInstance = new shaka.Player();
            shakaInstance.attach(video).then(function() {
                shakaInstance.getNetworkingEngine().registerRequestFilter(function(type, req) {
                    req.uris = req.uris.map(function(u) {
                        var activePx = PROXIES[currentProxyIdx] || PROXIES[0];
                        if (u.indexOf(activePx) === 0) return u;
                        if (u.indexOf("/api/proxy?u=") !== -1 || u.indexOf("/proxy?u=") !== -1) {
                            return toProxiedUrl(unwrapProxiedUrl(u), currentProxyIdx);
                        }
                        if (u.indexOf("lovable.app/api/") !== -1 || u.indexOf("ascode.pages.dev/") !== -1 || u.indexOf("localhost") !== -1 || (!u.startsWith("http://") && !u.startsWith("https://"))) {
                            try {
                                return toProxiedUrl(new URL(u, baseMpdUrl).href, currentProxyIdx);
                            } catch (_) {
                                var cleanU = u.split("?")[0];
                                var filename = cleanU.substring(cleanU.lastIndexOf("/") + 1);
                                if (baseMpdUrl && filename) {
                                    return toProxiedUrl(baseMpdUrl + filename, currentProxyIdx);
                                }
                            }
                        }
                        if (u.indexOf("fancode.com") !== -1 && u.indexOf("proxy") === -1) {
                            return toProxiedUrl(u, currentProxyIdx);
                        }
                        return u;
                    });
                });

                var cleanKid = cleanKey(kid);
                var cleanK = cleanKey(key);

                var config = {
                    manifest: {
                        dash: {
                            autoCorrectDrift: true,
                            ignoreMinBufferTime: false
                        },
                        defaultPresentationDelay: 16,
                        retryParameters: { maxAttempts: 5, baseDelay: 200, backoffFactor: 1.5 }
                    },
                    streaming: {
                        bufferingGoal: 30,
                        rebufferingGoal: 6,
                        bufferBehind: 20,
                        safeSeekOffset: 5,
                        stallEnabled: false,
                        retryParameters: { maxAttempts: 5, baseDelay: 200, backoffFactor: 1.5 }
                    },
                    abr: {
                        enabled: true,
                        defaultBandwidthEstimate: 1500000,
                        switchInterval: 8,
                        restrictions: { maxHeight: 1080 }
                    }
                };

                if (cleanKid && cleanK) {
                    config.drm = { clearKeys: {} };
                    config.drm.clearKeys[cleanKid] = cleanK;
                }
                shakaInstance.configure(config);

                function loadMpd() {
                    shakaInstance.load(proxiedMpd).then(function() {
                        drmRetryCount = 0;
                        hideLoading();
                        video.play().catch(function(){});
                        buildShakaQMenu(targetRes);
                    }).catch(function(err) {
                        console.error("Shaka load error:", err);
                        if (currentProxyIdx < PROXIES.length - 1) {
                            currentProxyIdx++;
                            proxiedMpd = toProxiedUrl(cleanMpd, currentProxyIdx);
                            loadMpd();
                        } else {
                            hideLoading();
                            showError("Stream unavailable or blocked by upstream CDN.");
                        }
                    });
                }

                loadMpd();

                shakaInstance.addEventListener("error", function(ev) {
                    var err = ev.detail;
                    if (err && err.severity === shaka.util.Error.Severity.RECOVERABLE) return;
                    if (drmRetryCount < 2) {
                        drmRetryCount++;
                        showError("Playback interrupted – retrying...");
                        setTimeout(function(){ if (shakaInstance) loadMpd(); }, 3000);
                    } else {
                        hideLoading();
                        showError("Stream unavailable or blocked by upstream CDN.");
                    }
                });
            }).catch(function(e) {
                hideLoading();
                showError("Player initialization error: " + (e.message || e));
            });
        }

        var lastPlayArgs = null;

        function updateQBadge(txt) {
            var b = document.getElementById("q-badge");

        }

        function playStream(rawUrl, targetRes, fallbackUrl, isDrm, kid, key) {
            lastPlayArgs = [rawUrl, targetRes, fallbackUrl, isDrm, kid, key];
            showLoading();
            $error.style.display = "none";
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            if (shakaInstance) { shakaInstance.destroy(); shakaInstance = null; }

            var clean = unwrapProxiedUrl(rawUrl);
            var activeSource = clean;
            var cleanFallback = (fallbackUrl && isValidStreamUrl(unwrapProxiedUrl(fallbackUrl))) ? unwrapProxiedUrl(fallbackUrl) : "";
            var isMpd = isDrm || clean.indexOf(".mpd") !== -1;
            if (isMpd) {
                playDrmStream(clean, kid || params.get("kid") || "", key || params.get("key") || "", targetRes);
                return;
            }

            var desired = targetRes || reqRes || "Auto";
            updateQBadge(currentRes || desired);
            buildQMenu();

            var tryDirectFirst = isDirectCorsHost(activeSource);
            currentProxyIdx = tryDirectFirst ? -1 : 0;
            var url = tryDirectFirst ? activeSource : toProxiedUrl(activeSource, 0);
            var isNativeHls = !!video.canPlayType("application/vnd.apple.mpegurl");
            var isSafariOrIos = (/iPad|iPhone|iPod/i.test(navigator.userAgent) && !window.MSStream) || (/Safari/i.test(navigator.userAgent) && !/Chrome|Chromium|Edg|OPR|Firefox/i.test(navigator.userAgent));

            if (isSafariOrIos && isNativeHls && !(tryDirectFirst && window.Hls && Hls.isSupported())) {
                var nativeTriedFallback = false;
                var onNativeErr = function() {
                    if (currentProxyIdx < PROXIES.length - 1) {
                        currentProxyIdx++;
                        video.src = toProxiedUrl(activeSource, currentProxyIdx);
                        video.play().catch(function(){});
                    } else if (!nativeTriedFallback && cleanFallback && cleanFallback !== activeSource) {
                        nativeTriedFallback = true;
                        activeSource = cleanFallback;
                        currentProxyIdx = isDirectCorsHost(activeSource) ? -1 : 0;
                        video.src = currentProxyIdx === -1 ? activeSource : toProxiedUrl(activeSource, 0);
                        video.play().catch(function(){});
                    } else {
                        video.removeEventListener("error", onNativeErr);
                        hideLoading();
                        showError("Stream unavailable or blocked by upstream CDN.", true);
                    }
                };
                video.addEventListener("error", onNativeErr);
                video.src = tryDirectFirst ? activeSource : url;
                video.play().catch(function(){});
                video.addEventListener("loadedmetadata", function() {
                    video.removeEventListener("error", onNativeErr);
                    hideLoading();
                    video.play().catch(function(){});
                    buildQMenu();
                }, { once: true });
                return;
            }

            if (window.Hls && Hls.isSupported()) {
                video.removeAttribute("src");
                video.load();
                var triedFallback = false;
                var networkRetries = 0;
                var vodSafetyMarginMs = 8000;
                var vodExtendDisabled = false;
                var vod404Count = 0;

                function extendStaleVodPlaylist(text) {
                    if (vodExtendDisabled || !text || text.indexOf("#EXTINF:") === -1 || text.indexOf("#EXT-X-ENDLIST") !== -1) return text;
                    var lines = text.split("\n");
                    var entries = [];
                    var headerLines = [];
                    var inHeader = true;
                    var curDur = "4.000";
                    var curPdt = "";
                    for (var i = 0; i < lines.length; i++) {
                        var l = lines[i].trim();
                        if (!l) continue;
                        if (l.indexOf("#EXTINF:") === 0) {
                            inHeader = false;
                            var dm = l.match(/#EXTINF:([0-9.]+)/);
                            if (dm) curDur = dm[1];
                        } else if (l.indexOf("#EXT-X-PROGRAM-DATE-TIME:") === 0) {
                            inHeader = false;
                            curPdt = l.substring(25).trim();
                        } else if (l.charAt(0) === "#") {
                            if (inHeader && l.indexOf("#EXT-X-MEDIA-SEQUENCE:") !== 0) {
                                headerLines.push(l);
                            }
                        } else {
                            inHeader = false;
                            entries.push({ dur: curDur, pdt: curPdt, uri: l });
                            curPdt = "";
                        }
                    }
                    if (!entries.length) return text;
                    var last = entries[entries.length - 1];
                    if (!last.pdt) return text;
                    var lastMs = Date.parse(last.pdt);
                    if (!lastMs || isNaN(lastMs)) return text;
                    var segMatch = last.uri.match(/^(.*-)(\d+)(\.ts.*)$/i);
                    if (!segMatch) return text;

                    var prefix = segMatch[1];
                    var lastSeq = parseInt(segMatch[2], 10);
                    var suffix = segMatch[3];
                    var segDurMs = Math.max(1000, Math.round((parseFloat(last.dur) || 4) * 1000));
                    var elapsedSegs = Math.floor((Date.now() - lastMs - vodSafetyMarginMs) / segDurMs);
                    if (elapsedSegs <= 0 || elapsedSegs > 10800) return text;

                    var windowSize = 75;
                    var seqMatch = text.match(/#EXT-X-MEDIA-SEQUENCE:(\d+)/);
                    var baseSeq = seqMatch ? parseInt(seqMatch[1], 10) : 0;

                    var startOffset = Math.max(1, elapsedSegs - (windowSize - 1));
                    var totalVirtual = entries.length + elapsedSegs;
                    var newBaseSeq = baseSeq + Math.max(0, totalVirtual - windowSize);
                    var finalEntries = [];

                    if (startOffset === 1) {
                        var keepFromOrig = Math.max(0, entries.length - (windowSize - elapsedSegs));
                        finalEntries = entries.slice(keepFromOrig);
                    }
                    for (var k = startOffset; k <= elapsedSegs; k++) {
                        var nextMs = lastMs + k * segDurMs;
                        finalEntries.push({
                            dur: last.dur,
                            pdt: new Date(nextMs).toISOString(),
                            uri: prefix + (lastSeq + k) + suffix
                        });
                    }

                    var out = headerLines.slice();
                    out.push("#EXT-X-MEDIA-SEQUENCE:" + newBaseSeq);
                    for (var j = 0; j < finalEntries.length; j++) {
                        out.push("#EXTINF:" + finalEntries[j].dur + ",");
                        if (finalEntries[j].pdt) out.push("#EXT-X-PROGRAM-DATE-TIME:" + finalEntries[j].pdt);
                        out.push(finalEntries[j].uri);
                    }
                    return out.join("\n") + "\n";
                }

                function NoCachePlaylistLoader() {
                    this.aborted = false;
                    this.stats = {
                        aborted: false,
                        loaded: 0,
                        total: 0,
                        retry: 0,
                        chunkCount: 0,
                        bwEstimate: 0,
                        loading: { start: 0, first: 0, end: 0 },
                        parsing: { start: 0, end: 0 },
                        buffering: { start: 0, end: 0 }
                    };
                }
                NoCachePlaylistLoader.prototype.destroy = function() { this.aborted = true; };
                NoCachePlaylistLoader.prototype.abort = function() { this.aborted = true; this.stats.aborted = true; };
                NoCachePlaylistLoader.prototype.load = function(context, config, callbacks) {
                    var self = this;
                    var t0 = performance.now();
                    self.stats.loading.start = t0;
                    fetch(context.url, { cache: "no-store" }).then(function(res) {
                        if (self.aborted) return;
                        var t1 = performance.now();
                        self.stats.loading.first = t1;
                        if (!res.ok) {
                            callbacks.onError({ code: res.status, text: res.statusText || "HTTP " + res.status }, context, res, self.stats);
                            return;
                        }
                        return res.text().then(function(data) {
                            if (self.aborted) return;
                            var t2 = performance.now();
                            var finalData = isDirectCorsHost(context.url) ? extendStaleVodPlaylist(data) : data;
                            self.stats.loading.end = t2;
                            self.stats.loaded = finalData.length;
                            self.stats.total = finalData.length;
                            self.stats.trequest = t0;
                            self.stats.tfirst = t1;
                            self.stats.tload = t2;
                            callbacks.onSuccess({ url: context.url, data: finalData }, self.stats, context, res);
                        });
                    }).catch(function(err) {
                        if (self.aborted) return;
                        callbacks.onError({ code: 0, text: (err && err.message) || "Network error" }, context, null, self.stats);
                    });
                };

                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: false,
                    liveSyncDurationCount: 3,
                    liveMaxLatencyDurationCount: 10,
                    maxBufferLength: 30,
                    maxMaxBufferLength: 60,
                    pLoader: NoCachePlaylistLoader,
                    xhrSetup: function(xhr) { xhr.withCredentials = false; }
                });
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(video);

                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                    networkRetries = 0;
                    hideLoading();
                    if (hlsInstance.levels && hlsInstance.levels.length > 1 && desired !== "Auto") {
                        var targetIdx = findLevelIndex(hlsInstance.levels, desired);
                        if (targetIdx !== -1) {
                            selectedLevel = targetIdx;
                            hlsInstance.currentLevel = targetIdx;
                        }
                    }
                    buildQMenu();
                    video.play().catch(function(){});
                });
                hlsInstance.on(Hls.Events.LEVEL_SWITCHED, function(ev, data) {
                    buildQMenu();
                });
                hlsInstance.on(Hls.Events.FRAG_LOADED, function() {
                    networkRetries = 0;
                    vod404Count = 0;
                    hideLoading();
                });
                hlsInstance.on(Hls.Events.ERROR, function(ev, data) {
                    if (data && data.details === Hls.ErrorDetails.FRAG_LOAD_ERROR && data.response && data.response.code === 404) {
                        vod404Count++;
                        vodSafetyMarginMs = Math.min(60000, vodSafetyMarginMs + 8000);
                        if (vod404Count >= 5) vodExtendDisabled = true;
                    }
                    if (data.fatal) {
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                            if (currentProxyIdx < PROXIES.length - 1) {
                                currentProxyIdx++;
                                var altPxUrl = toProxiedUrl(activeSource, currentProxyIdx);
                                hlsInstance.loadSource(altPxUrl);
                                hlsInstance.startLoad();
                            } else if (!triedFallback && cleanFallback && activeSource !== cleanFallback) {
                                triedFallback = true;
                                activeSource = cleanFallback;
                                currentProxyIdx = isDirectCorsHost(activeSource) ? -1 : 0;
                                var fbUrl = currentProxyIdx === -1 ? activeSource : toProxiedUrl(activeSource, 0);
                                hlsInstance.loadSource(fbUrl);
                                hlsInstance.startLoad();
                            } else if (networkRetries < 1) {
                                networkRetries++;
                                hlsInstance.startLoad();
                            } else {
                                hideLoading();
                                showError("Stream unavailable or blocked by upstream CDN.", true);
                            }
                        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                            hlsInstance.recoverMediaError();
                        } else {
                            hideLoading();
                            showError("Stream playback error.", true);
                        }
                    }
                });
                return;
            }

            if (isNativeHls) {
                video.src = tryDirectFirst ? activeSource : url;
                video.play().catch(function(){});
                video.addEventListener("loadedmetadata", function() {
                    hideLoading();
                    video.play().catch(function(){});
                    buildQMenu();
                }, { once: true });
                return;
            }

            hideLoading();
            showError("HLS not supported in this browser.");
        }

        // Load match metadata from the single configured JSON feed.
        // Supports either { "matches": [...] } or a plain JSON array.
        function fetchJsonMatches() {
            var url = JSON_API + (JSON_API.indexOf("?") === -1 ? "?" : "&") + "_=" + Date.now();
            return fetch(url, { cache: "no-store" }).then(function(response) {
                if (!response.ok) throw new Error("Match feed returned HTTP " + response.status);
                return response.json();
            }).then(function(data) {
                var matches = Array.isArray(data) ? data : (data && Array.isArray(data.matches) ? data.matches : null);
                if (!matches) throw new Error("Invalid JSON feed: expected an array or a matches array.");
                return matches.filter(function(match) { return match && typeof match === "object"; });
            });
        }

        function fetchAllMatches() {
            return fetchJsonMatches();
        }

        function findMatch(matches, id) {
            if (!id || !matches.length) return null;
            var target = String(id).trim().toLowerCase();
            var targetBase = target.split("_")[0];
            return matches.find(function(m) {
                var cur = String(m.match_id || "").trim().toLowerCase();
                if (cur === target) return true;
                var curBase = cur.split("_")[0];
                return curBase === targetBase || cur === targetBase || curBase === target;
            });
        }

        if (matchId) {
            showLoading();
            fetchAllMatches()
                .then(function(matches) {
                    var m = findMatch(matches, matchId);
                    if (!m) {
                        hideLoading();
                        showError("Match not found: " + matchId);
                        return;
                    }
                    var rawTitle = (m.team_1 && m.team_2) ? (m.team_1 + " vs " + m.team_2) : (m.match_name || m.title || "FanCode Player");
                    var cleanTitle = rawTitle.replace(/\s*\[(English|Hindi|Tamil|Kannada|Telugu|Bengali|ENG|HIN|TAM)\]/gi, '').trim();
                    document.title = cleanTitle + " · SportLink Live";

                    // Populate Audio Language Switcher in Player Header
                    var baseId = String(m.match_id || "").split("_")[0].toLowerCase();
                    var siblings = matches.filter(function(x) {
                        return String(x.match_id || "").split("_")[0].toLowerCase() === baseId && (x.stream_url || x.dai_url || x.adfree_url);
                    });
                    var topBar = document.getElementById("top-lang-bar");
                    var topBtns = document.getElementById("top-lang-buttons");
                    if (topBar && topBtns) {
                        if (siblings.length > 1) {
                            topBar.style.display = "flex";
                            topBtns.innerHTML = "";
                            siblings.forEach(function(sib) {
                                var sLang = sib.language || (String(sib.match_id).includes("_tam") ? "Tamil" : (String(sib.match_id).includes("_hin") ? "Hindi" : "English"));
                                var isCur = String(sib.match_id).toLowerCase() === String(m.match_id).toLowerCase();
                                var b = document.createElement("button");
                                b.type = "button";
                                b.style.padding = "3px 8px";
                                b.style.borderRadius = "6px";
                                b.style.fontSize = "11px";
                                b.style.fontWeight = isCur ? "800" : "600";
                                b.style.border = "none";
                                b.style.cursor = isCur ? "default" : "pointer";
                                b.style.background = isCur ? "#ef4444" : "rgba(255,255,255,0.12)";
                                b.style.color = "#fff";
                                b.style.transition = "0.15s";
                                b.textContent = sLang.substring(0, 3).toUpperCase();
                                b.title = sLang;
                                b.onclick = function() {
                                    if (!isCur) {
                                        var targetUrl = "player.html?id=" + encodeURIComponent(sib.match_id) + (reqRes !== "Auto" ? "&r=" + encodeURIComponent(reqRes) : "");
                                        location.replace(targetUrl);
                                    }
                                };
                                topBtns.appendChild(b);
                            });
                        } else {
                            topBar.style.display = "none";
                        }
                    }

                    availableQualities = parseMatchQualities(m);
                    if (!availableQualities.length) {
                        hideLoading();
                        showError("Stream offline or unavailable.");
                        return;
                    }

                    var resOrder = { "1080p": 6, "720p": 5, "540p": 4, "480p": 3, "360p": 2, "240p": 1, "Auto": 0 };
                    availableQualities.sort(function(a, b) {
                        return (resOrder[b.res] || parseInt(b.res) || 0) - (resOrder[a.res] || parseInt(a.res) || 0);
                    });

                    var chosen = availableQualities.find(function(x) {
                        return x.res.toLowerCase() === reqRes.toLowerCase() || x.res.replace("p","") === reqRes.replace("p","");
                    }) || availableQualities[0];

                    currentRes = chosen.res;
                    playStream(chosen.url, chosen.targetRes || chosen.res, chosen.fallbackUrl, chosen.isDrm, chosen.kid, chosen.key);
                })
                .catch(function(e) {
                    hideLoading();
                    showError("Could not load match data. Please reload.");
                });
        } else if (rawUrl) {
            if (rawUrl.indexOf(".mpd") !== -1) {
                var kid = params.get("kid") || "";
                var key = params.get("key") || "";
                playDrmStream(rawUrl, kid, key, reqRes);
                return;
            }
            playStream(rawUrl);
        } else {
            hideLoading();
            showError("No stream URL or match ID provided.");
        }

                var p = video.play();
                if (p && p.catch) {
                    p.catch(function(err) {
                        console.warn("Resume failed, reloading stream:", err);
                        if (lastPlayArgs) playStream.apply(null, lastPlayArgs);

            iMuted.classList.toggle("hidden", !m); iUnmuted.classList.toggle("hidden", m);

        function fmtTime(t) { if(!t||!isFinite(t)) return "0:00"; var h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=Math.floor(t%60); return h>0 ? h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0") : m+":"+String(s).padStart(2,"0"); }

        playBtn.onclick = togglePlay;
        videoArea.addEventListener("click", function(e) { if(e.target.closest(".ctrl-btn")||e.target.closest(".quality-popup")||e.target.closest("#back-btn")) return; togglePlay(); });
        video.addEventListener("play", updatePlayIcons);
        video.addEventListener("pause", updatePlayIcons);
        video.addEventListener("volumechange", updateMuteIcons);
        video.addEventListener("timeupdate", function() { if(isDragging) return; if(video.duration){ var p=video.currentTime/video.duration*100; progFilled.style.width=p+"%"; progThumb.style.left=p+"%"; curTime.textContent=fmtTime(video.currentTime); } });
        muteBtn.onclick = function(e) { e.stopPropagation(); video.muted=!video.muted; if(!video.muted&&video.volume===0) video.volume=0.5; };

        // Keyboard
        document.addEventListener("keydown", function(e) {
            if(e.key===" ") { e.preventDefault(); togglePlay(); }
            if(e.key==="m"||e.key==="M") { e.preventDefault(); video.muted=!video.muted; }
            if(e.key==="Escape"&&document.fullscreenElement) document.exitFullscreen();
        });

        // Progress drag
        progTrack.addEventListener("mousedown", startDrag);
        progTrack.addEventListener("touchstart", startDrag, {passive:false});
        document.addEventListener("mousemove", onDrag); document.addEventListener("touchmove", onDrag, {passive:false});
        document.addEventListener("mouseup", endDrag); document.addEventListener("touchend", endDrag);
        function startDrag(e) { e.preventDefault(); isDragging=true; videoArea.classList.remove("hide-controls"); seekTo(e); }
        function onDrag(e) { if(!isDragging) return; e.preventDefault(); seekTo(e); }
        function endDrag() { if(!isDragging) return; isDragging=false; resetAutoHide(); }
        function seekTo(e) {
            var r=progTrack.getBoundingClientRect(), x=e.touches?e.touches[0].clientX:e.clientX;
            var p=Math.max(0,Math.min(1,(x-r.left)/r.width));
            progFilled.style.width=p*100+"%"; progThumb.style.left=p*100+"%";
            if(video.duration) { video.currentTime=p*video.duration; curTime.textContent=fmtTime(video.currentTime); }
        }

        // Auto-hide controls
        videoArea.addEventListener("mousemove", resetAutoHide);
        videoArea.addEventListener("touchstart", resetAutoHide, {passive:true});
        function resetAutoHide() {
            videoArea.classList.remove("hide-controls");
            clearTimeout(controlsTimer);
            if(!video.paused&&!isDragging&&!isQMenuOpen) controlsTimer=setTimeout(function(){videoArea.classList.add("hide-controls")},3000);
        }

        // Fullscreen
        fsBtn.onclick = function() { if(!document.fullscreenElement){document.documentElement.requestFullscreen();} else{document.exitFullscreen();} resetAutoHide(); };
        video.addEventListener("dblclick", function() { if(!document.fullscreenElement){document.documentElement.requestFullscreen();} else{document.exitFullscreen();} });

        // Quality menu
        var qBadge = document.getElementById("q-badge");
        function toggleQMenu(e) { e.stopPropagation(); qMenu.classList.toggle("open"); isQMenuOpen=qMenu.classList.contains("open"); resetAutoHide(); }
        qBtn.addEventListener("click", toggleQMenu);
        if (qBadge) qBadge.addEventListener("click", toggleQMenu);
        document.addEventListener("click", function(e) { if(isQMenuOpen&&!qMenu.contains(e.target)&&e.target!==qBtn&&e.target!==qBadge) { qMenu.classList.remove("open"); isQMenuOpen=false; } });

        function buildQMenu() {
            if (shakaInstance) {
                buildShakaQMenu(currentRes);
                return;
            }
            qMenu.innerHTML = "";
            if (availableQualities.length > 0) {
                availableQualities.forEach(function(item) {
                    var div = document.createElement("div");
                    div.className = "q-item" + (item.res === currentRes ? " active" : "");
                    div.textContent = item.res;
                    div.onclick = function(e) {
                        e.stopPropagation();
                        if (item.res !== currentRes) {
                            currentRes = item.res;
                            reqRes = item.res;
                            playStream(item.url, item.targetRes || item.res, item.fallbackUrl);
                        }
                        qMenu.classList.remove("open");
                        isQMenuOpen = false;
                        buildQMenu();
                    };
                    qMenu.appendChild(div);
                });
                return;
            }

            if (hlsInstance && hlsInstance.levels && hlsInstance.levels.length > 1) {
                var items = [{ name: "Auto", level: -1, height: 99999 }];
                hlsInstance.levels.forEach(function(l, i) {
                    var label = (l.height ? l.height + "p" : "Level " + (i + 1));
                    items.push({ name: label, level: i, height: l.height || 0 });
                });

                items.sort(function(a, b) { return b.height - a.height; });

                items.forEach(function(item) {
                    var div = document.createElement("div");
                    var isActive = (item.level === selectedLevel);
                    div.className = "q-item" + (isActive ? " active" : "");
                    div.textContent = item.name;
                    div.onclick = function(e) {
                        e.stopPropagation();
                        if (item.level === -1) {
                            selectedLevel = -1;
                            hlsInstance.currentLevel = -1;
                        } else {
                            selectedLevel = item.level;
                            hlsInstance.currentLevel = item.level;
                        }
                        qMenu.classList.remove("open");
                        isQMenuOpen = false;
                        buildQMenu();
                    };
                    qMenu.appendChild(div);
                });
                return;
            }
        }

        // Unmute on click
        document.addEventListener("click", function unmute() { video.muted=false; document.removeEventListener("click",unmute); }, {once:true});
        var shareBtn = document.getElementById("share-btn");
        if (shareBtn) {
            shareBtn.addEventListener("click", function(e) {
                e.stopPropagation();
                var shareUrl = window.location.href;
                var shareTitle = document.title || "SportLink Pokémon Player";
                if (navigator.share) {
                    navigator.share({ title: shareTitle, url: shareUrl }).catch(function(){});
                } else if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(shareUrl).then(function() {
                        var err = document.getElementById("error-msg");
                        if (err) {
                            err.style.background = "rgba(16,185,129,0.95)";
                            err.textContent = "Share link copied to clipboard!";
                            err.style.display = "block";
                            setTimeout(function(){ err.style.display = "none"; err.style.background = "rgba(239,68,68,0.9)"; }, 3500);
                        }
                    }).catch(function() {
                        prompt("Copy match link:", shareUrl);
                    });
                } else {
                    prompt("Copy match link:", shareUrl);
                }
            });
        }

        document.addEventListener("touchstart", function unmute() { video.muted=false; document.removeEventListener("touchstart",unmute); }, {once:true});

    })();
