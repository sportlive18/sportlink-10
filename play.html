<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000">
<meta name="referrer" content="no-referrer">
<title></title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Acme&family=Amaranth:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;height:-webkit-fill-available;-webkit-text-size-adjust:100%;}
body{width:100%;height:100%;min-height:100dvh;background:#000;overflow:hidden;font-family:'Poppins',-apple-system,BlinkMacSystemFont,sans-serif;}

/* Player */
#player{position:fixed;inset:0;background:#000;user-select:none;-webkit-user-select:none;overflow:hidden;}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:center center;transition:transform .3s ease,object-fit .2s;}

/* Initial loading overlay */
#overlay{position:absolute;inset:0;z-index:10;background:#080808;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .4s;}
#overlay.gone{opacity:0;pointer-events:none;}
.load-ring{position:relative;width:48px;height:48px;}
.load-ring::before,.load-ring::after{content:'';position:absolute;border-radius:50%;}
.load-ring::before{inset:0;border:3px solid rgba(255,255,255,.08);}
.load-ring::after{inset:0;border:3px solid transparent;border-top-color:rgba(255,255,255,.85);animation:rot .7s linear infinite;}
@keyframes rot{to{transform:rotate(360deg)}}
.load-label{font-size:12px;color:rgba(255,255,255,.38);letter-spacing:.4px;}

/* Buffering spinner (center, only during buffering) */
#bufspin{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:8;pointer-events:none;display:none;}
#bufspin div{width:32px;height:32px;border:2.5px solid rgba(255,255,255,.12);border-top-color:rgba(255,255,255,.75);border-radius:50%;animation:rot .65s linear infinite;}

/* Error overlay */
#err-ov{position:absolute;inset:0;z-index:11;background:#0d0d16;display:none;align-items:center;justify-content:center;padding:24px;}
#err-ov.show{display:flex;}
.ec{background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);border-radius:20px;padding:44px 28px 36px;max-width:380px;width:100%;text-align:center;}
.ec .ei-wrap{width:62px;height:62px;border-radius:50%;border:1.5px solid rgba(255,255,255,.13);background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
.ec .ei-wrap svg{width:30px;height:30px;stroke:rgba(255,255,255,.48);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.ec .etxt{font-size:19px;font-weight:700;color:#efefef;margin-bottom:8px;}
.ec .emsg{font-size:13px;color:rgba(255,255,255,.38);line-height:1.75;margin-bottom:22px;}
.ec .eretry{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;color:rgba(255,255,255,.32);}
.retdot{width:6px;height:6px;border-radius:50%;background:#ffcc00;animation:rpulse 1.4s ease-in-out infinite;}
@keyframes rpulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}

/* Center play button — premium */
#bigplay{position:absolute;inset:0;z-index:16;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity .22s;}
#bigplay.shown{pointer-events:auto;}
#bigplay.gone{opacity:0;pointer-events:none;}
.bpbtn{position:relative;width:62px;height:62px;border-radius:50%;
  background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.06));
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1.5px solid rgba(255,255,255,.55);
  box-shadow:0 6px 28px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:transform .18s,background .18s,border-color .18s,box-shadow .18s;}
.bpbtn::before{content:'';position:absolute;inset:-10px;border-radius:50%;border:1.5px solid rgba(255,255,255,.18);animation:bp-pulse 2.5s ease-out infinite;pointer-events:none;}
.bpbtn::after{content:'';position:absolute;inset:-20px;border-radius:50%;border:1px solid rgba(255,255,255,.09);animation:bp-pulse 2.5s ease-out .5s infinite;pointer-events:none;}
@keyframes bp-pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.35);opacity:0}}
.bpbtn:hover{transform:scale(1.08);background:linear-gradient(145deg,rgba(255,255,255,.3),rgba(255,255,255,.12));border-color:rgba(255,255,255,.8);box-shadow:0 8px 32px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.3);}
.bpbtn:active{transform:scale(.9);}
.bpbtn svg{width:24px;height:24px;margin-left:3px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4));}

/* Controls container — liquid glass panel */
#ctrls{position:absolute;bottom:0;left:0;right:0;z-index:20;transition:opacity .28s;}
#ctrls.gone{opacity:0;pointer-events:none;}

/* progress bar */
#prog{margin:0 12px 6px;height:18px;display:flex;align-items:center;cursor:pointer;position:relative;}
.pt{position:relative;height:3px;width:100%;background:rgba(255,255,255,.2);border-radius:2px;transition:height .13s;overflow:visible;}
#prog:hover .pt,#prog.drag .pt{height:5px;}
.pbf{position:absolute;left:0;top:0;height:100%;background:rgba(255,255,255,.32);border-radius:2px;width:0;}
.ppl{position:absolute;left:0;top:0;height:100%;background:#ff3b30;border-radius:2px;width:0;}
.pth{position:absolute;top:50%;left:0;width:12px;height:12px;background:#ff3b30;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(255,59,48,.25),0 0 8px rgba(255,59,48,.4);pointer-events:none;transition:transform .12s;}
#prog:hover .pth,#prog.drag .pth{transform:translate(-50%,-50%) scale(1.3);}

/* glass bar */
#crow{
  display:flex;align-items:center;padding:6px 10px 12px;gap:6px;
  background:rgba(0,0,0,.38);
  -webkit-backdrop-filter:blur(20px) saturate(200%);
  backdrop-filter:blur(20px) saturate(200%);
  border-top:1px solid rgba(255,255,255,.07);
}

/* Liquid glass buttons */
.cb{
  width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.1);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 2px 8px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:#fff;
  transition:background .15s,transform .12s,border-color .15s,box-shadow .15s;
  flex-shrink:0;padding:0;outline:none;
}
.cb:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.3);box-shadow:0 4px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);}
.cb:active{transform:scale(.88);}
.cb svg{display:block;}
.csp{flex:1;}

/* Live pill */
.live-pill{display:flex;align-items:center;gap:5px;padding:4px 9px 4px 7px;border-radius:20px;background:rgba(255,69,69,.13);border:1px solid rgba(255,69,69,.32);font-size:10.5px;font-weight:700;letter-spacing:.6px;color:#ff5a5a;cursor:default;flex-shrink:0;white-space:nowrap;}
.ldot{width:5px;height:5px;border-radius:50%;background:#ff4545;animation:lblink 1.3s infinite;flex:none;}
@keyframes lblink{0%,100%{opacity:1}50%{opacity:.3}}

/* Mute pulse when muted */
@keyframes mutePulse{0%,100%{opacity:.5}50%{opacity:1}}
#bvol.is-muted{animation:mutePulse 1.8s ease-in-out infinite;}
#bvol.is-muted{border-color:rgba(255,100,100,.4);background:rgba(255,59,48,.15);}

/* Quality pill button */
#bq{border-radius:16px !important;width:auto !important;padding:0 11px !important;height:34px !important;gap:4px;}
#qlbl{font-size:11.5px;font-weight:700;letter-spacing:.3px;}
.qchev{flex-shrink:0;}

/* Custom quality menu */
#qmenu{
  position:absolute;
  right:10px;
  bottom:64px;
  z-index:30;
  min-width:130px;
  max-height:60vh;
  overflow-y:auto;
  background:rgba(20,20,24,.96);
  -webkit-backdrop-filter:blur(16px);
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;
  padding:6px;
  box-shadow:0 10px 30px rgba(0,0,0,.55);
  display:none;
  opacity:0;
  transform:translateY(6px);
  transition:opacity .16s ease, transform .16s ease;
}
#qmenu.open{ display:block; opacity:1; transform:translateY(0); }
#qmenu .qi{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:9px 12px;
  border-radius:8px;
  font-size:13px;
  font-weight:600;
  color:rgba(255,255,255,.85);
  cursor:pointer;
  transition:background .12s;
  white-space:nowrap;
}
#qmenu .qi:hover{ background:rgba(255,255,255,.08); }
#qmenu .qi.active{ color:#ff5a5a; background:rgba(255,90,90,.1); }
#qmenu .qi .qcheck{ font-size:11px; opacity:0; }
#qmenu .qi.active .qcheck{ opacity:1; }
#qmenu .qhead{
  font-size:10px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:rgba(255,255,255,.4);
  padding:6px 10px 8px;
}

/* ════════════════════════════════════════════
   Social badge — top-left corner (Telegram only)
════════════════════════════════════════════ */
#social-badges{
  position:absolute;
  top:10px;
  left:10px;
  right:auto;
  z-index:25;
  display:flex;
  align-items:center;
  gap:6px;
  transition:opacity .3s;
  pointer-events:auto;
}
#social-badges a.social-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 16px 8px 9px;
  border-radius:50px;
  border:2px solid rgba(255,255,255,.35);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
  color:#fff;
  font-size:15px;
  font-weight:900;
  letter-spacing:.4px;
  text-decoration:none;
  transition:transform .15s,box-shadow .2s,filter .2s;
  white-space:nowrap;
  text-shadow:0 1px 3px rgba(0,0,0,.3);
}
#social-badges a.social-btn:hover{
  transform:translateY(-2px) scale(1.04);
  filter:brightness(1.1);
}
#social-badges a.social-btn:active{ transform:scale(.96); }

/* Telegram accent */
#social-badges a.tg-btn{
  background:linear-gradient(135deg,rgba(41,182,246,.95),rgba(14,116,182,.95));
  box-shadow:0 6px 24px rgba(41,182,246,.5),inset 0 2px 0 rgba(255,255,255,.3);
}
#social-badges a.tg-btn:hover{
  box-shadow:0 8px 30px rgba(41,182,246,.6),inset 0 2px 0 rgba(255,255,255,.4);
}

#social-badges .social-icon{
  width:26px;
  height:26px;
  border-radius:50%;
  background:rgba(255,255,255,.25);
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
}
#social-badges .social-icon svg{
  width:16px;
  height:16px;
  fill:#fff;
  display:block;
}

/* Mobile — keep text visible, slightly smaller */
@media (max-width:768px){
  #social-badges{ gap:5px; top:8px; left:8px; }
  #social-badges a.social-btn{ padding:7px 14px 7px 7px; gap:6px; font-size:14px; }
}
/* Very small phones */
@media (max-width:360px){
  #social-badges a.social-btn{ padding:6px 12px 6px 6px; font-size:13px; }
  #social-badges .social-icon{ width:22px; height:22px; }
  #social-badges .social-icon svg{ width:13px; height:13px; }
}

/* ════════════════════════════════════════════
   TELEGRAM POPUP
════════════════════════════════════════════ */
#tgOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  -webkit-backdrop-filter:blur(16px);
  backdrop-filter:blur(16px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999999;
  padding:20px;
  animation:fadeInPopup .4s cubic-bezier(.25,.8,.25,1);
}
#tgOverlay.show{ display:flex; }
#tgCard{
  width:100%;
  max-width:400px;
  background:linear-gradient(160deg,#121821,#0a0c0f);
  border:1px solid rgba(79,195,247,.15);
  border-radius:24px;
  padding:36px 28px 28px;
  box-shadow:0 40px 80px rgba(0,0,0,.8),0 0 60px rgba(79,195,247,.03);
  text-align:center;
  position:relative;
  overflow:hidden;
}
#tgCard::before{
  content:"";
  position:absolute;
  top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(circle at 30% 20%,rgba(79,195,247,.04),transparent 60%);
  pointer-events:none;
}
#tgIcon{
  width:72px;height:72px;
  margin:0 auto 16px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#2AABEE,#229ED9);
  box-shadow:0 0 40px rgba(42,171,238,.2);
  position:relative;z-index:1;
}
#tgIcon svg{ width:36px;height:36px; }
#tgCard h2{
  margin:0 0 8px;
  font-size:clamp(1.3rem,2.5vw,1.8rem);
  font-weight:700;
  color:#fff;
  position:relative;z-index:1;
  letter-spacing:-.01em;
}
#tgCard p{
  margin:0 0 24px;
  color:#8e9baf;
  font-size:clamp(.9rem,1.2vw,1.05rem);
  line-height:1.6;
  position:relative;z-index:1;
}
.tgBtns{ display:flex;gap:12px;position:relative;z-index:1; }
.tgBtn{
  flex:1;height:48px;
  border-radius:40px;
  font-weight:700;
  font-size:clamp(.85rem,1vw,1rem);
  cursor:pointer;
  transition:all .25s ease;
  border:none;
  font-family:'Poppins',sans-serif;
  letter-spacing:.01em;
}
#joinNow{
  background:linear-gradient(135deg,#4fc3f7,#2196f3);
  color:#fff;
  box-shadow:0 6px 24px rgba(79,195,247,.25);
}
#joinNow:hover{ transform:translateY(-2px);box-shadow:0 10px 32px rgba(79,195,247,.35); }
#joinedBtn{
  background:rgba(255,255,255,.05);
  color:#8e9baf;
  border:1px solid rgba(255,255,255,.08);
}
#joinedBtn:hover{ background:rgba(255,255,255,.08);color:#fff; }
@keyframes fadeInPopup{
  from{opacity:0;transform:scale(.95) translateY(12px);}
  to{opacity:1;transform:scale(1) translateY(0);}
}
@media (max-width:480px){
  #tgCard{ padding:24px 18px 20px;border-radius:20px; }
  #tgIcon{ width:60px;height:60px; }
  #tgIcon svg{ width:30px;height:30px; }
  #tgCard h2{ font-size:1.2rem; }
  #tgCard p{ font-size:.85rem;margin-bottom:18px; }
  .tgBtn{ height:42px;font-size:.8rem; }
}
</style>
</head>
<body>

<div id="player">
  <video id="vid" autoplay muted playsinline preload="metadata"></video>

  <!-- initial loading -->
  <div id="overlay">
    <div class="load-ring"></div>
    <div class="load-label">Connecting to stream…</div>
  </div>

  <!-- buffering spinner -->
  <div id="bufspin"><div></div></div>

  <!-- error -->
  <div id="err-ov">
    <div class="ec">
      <div class="ei-wrap"><svg viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg></div>
      <div class="etxt" id="etitle">Stream Unavailable</div>
      <div class="emsg" id="emsg"></div>
      <div class="eretry" id="eretry" style="display:none"><span class="retdot"></span><span>Retrying…</span></div>
    </div>
  </div>

  <!-- center play button -->
  <div id="bigplay">
    <div class="bpbtn" id="bpbtn">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.87l11-6.86a1 1 0 0 0 0-1.72L9.5 4.27A1 1 0 0 0 8 5.14z"/></svg>
    </div>
  </div>

  <!-- Social badge — top-left corner (Telegram only, bolder & bigger) -->
  <div class="social-badges" id="social-badges">

    <!-- Telegram -->
    <a href="https://t.me/sportlink10" target="_blank" rel="noopener noreferrer" class="social-btn tg-btn" title="Sportlink on Telegram — @sportlink10">
      <div class="social-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
        </svg>
      </div>
      <span>@sportlink10</span>
    </a>

  </div>

  <!-- controls -->
  <div id="ctrls">
    <!-- progress -->
    <div id="prog">
      <div class="pt">
        <div class="pbf" id="pbuf"></div>
        <div class="ppl" id="ppl"></div>
        <div class="pth" id="pth"></div>
      </div>
    </div>
    <!-- glass bar -->
    <div id="crow">
      <!-- play/pause -->
      <button class="cb" id="bplay" title="Play / Pause">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" id="pico">
          <rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/>
        </svg>
      </button>
      <!-- mute -->
      <button class="cb" id="bvol" title="Mute / Unmute">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" id="vico">
          <path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/>
          <path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/>
          <path d="M19 6a9 9 0 0 1 0 12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/>
        </svg>
      </button>
      <!-- live pill -->
      <div class="live-pill" id="livepill"><span class="ldot"></span><span id="lpitext">LIVE</span></div>
      <div class="csp"></div>
      <!-- quality -->
      <button class="cb" id="bq" title="Quality" style="display:none">
        <span id="qlbl">–</span>
        <svg class="qchev" width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><polyline points="2,3 5,7 8,3"/></svg>
      </button>
      <!-- fill/fit -->
      <button class="cb" id="bfill" title="Fill / Fit">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" id="fillico">
          <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
          <path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
        </svg>
      </button>
      <!-- pip -->
      <button class="cb" id="bpip" title="Picture in Picture">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12.5" y="11.5" width="7" height="5" rx="1.5" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <!-- fullscreen -->
      <button class="cb" id="bfs" title="Fullscreen">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" id="fsico">
          <path d="M9 4H4v5"/><path d="M15 4h5v5"/><path d="M9 20H4v-5"/><path d="M15 20h5v-5"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- quality menu -->
  <div id="qmenu" role="menu" aria-label="Quality">
    <div class="qhead">Quality</div>
    <div id="qlist"></div>
  </div>
</div>

<!-- ====== TELEGRAM POPUP ====== -->
<div id="tgOverlay">
  <div id="tgCard">
    <div id="tgIcon">
      <svg viewBox="0 0 24 24" fill="white" width="36" height="36">
        <path d="M23.05 2.1L19.6 21.3c-.26 1.15-.94 1.43-1.9.9l-5.26-3.88-2.54 2.45c-.28.28-.52.52-1.06.52l.38-5.4L19.9 5.8c.46-.4-.1-.63-.72-.23L7.5 13.03l-5.24-1.64c-1.14-.36-1.16-1.14.24-1.68L21.6.9c.95-.36 1.78.23 1.45 1.2z"/>
      </svg>
    </div>
    <h2>Join Telegram Channel</h2>
    <p>Get match links &amp; live updates delivered straight to your phone.</p>
    <div class="tgBtns">
      <button class="tgBtn" id="joinedBtn">Already Joined</button>
      <button class="tgBtn" id="joinNow">Join Now</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

var JSON_URL  = 'https://raw.githubusercontent.com/kajju027/Fancode-Events-Json/refs/heads/main/fancode.json';
var LANG_MAP  = {eng:'ENGLISH',hin:'HINDI',tam:'TAMIL',tel:'TELUGU',ben:'BENGALI',mar:'MARATHI'};
var Q_ORDER   = ['1080p','720p','540p','480p','360p','240p'];
var DEFAULT_Q = '540p';

var sp = new URLSearchParams(location.search);
var idp = sp.get('id')||'';
var si  = parseInt(sp.get('s')||'0',10);
var ui  = idp.indexOf('_');
var matchId  = ui>-1 ? idp.slice(0,ui) : idp;
var langCode = ui>-1 ? idp.slice(ui+1) : 'eng';

var vid      = document.getElementById('vid');
var player   = document.getElementById('player');
var overlay  = document.getElementById('overlay');
var bufspin  = document.getElementById('bufspin');
var errOv    = document.getElementById('err-ov');
var ctrls    = document.getElementById('ctrls');
var prog     = document.getElementById('prog');
var pbuf     = document.getElementById('pbuf');
var ppl      = document.getElementById('ppl');
var pth      = document.getElementById('pth');
var bplay    = document.getElementById('bplay');
var pico     = document.getElementById('pico');
var bvol     = document.getElementById('bvol');
var vico     = document.getElementById('vico');
var livepill = document.getElementById('livepill');
var lpitext  = document.getElementById('lpitext');
var bq       = document.getElementById('bq');
var qlbl     = document.getElementById('qlbl');
var bfill    = document.getElementById('bfill');
var fillico  = document.getElementById('fillico');
var bpip     = document.getElementById('bpip');
var bfs      = document.getElementById('bfs');
var fsico    = document.getElementById('fsico');
var bigplay  = document.getElementById('bigplay');
var bpbtn    = document.getElementById('bpbtn');
var qmenu    = document.getElementById('qmenu');
var qlist    = document.getElementById('qlist');

var shakaPlayer = null;
var qStreams = {}, currentQ = DEFAULT_Q;
var isLive = true, isDragging = false, uPaused = false, hasError = false;
var fillModeIdx = 0, isMuted = true;
var hideTimer = null, retryTimer = null;
var playerActivated = false;

var FILL_MODES = [
  {fit:'contain', scale:1,   title:'Fit',
   icon:'<rect x="2" y="4" width="20" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="7" y="8" width="10" height="8" rx="1" fill="currentColor" opacity=".45"/>'},
  {fit:'cover',   scale:1,   title:'Fill',
   icon:'<rect x="2" y="4" width="20" height="16" rx="2" fill="currentColor" opacity=".2" stroke="currentColor" stroke-width="1.7"/><path d="M2 4l20 16M22 4L2 20" stroke="currentColor" stroke-width="1" opacity=".35"/>'},
  {fit:'contain', scale:1.4, title:'Zoom',
   icon:'<circle cx="10.5" cy="10.5" r="7" fill="none" stroke="currentColor" stroke-width="1.7"/><line x1="16" y1="16" x2="21.5" y2="21.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><line x1="10.5" y1="7.5" x2="10.5" y2="13.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><line x1="7.5" y1="10.5" x2="13.5" y2="10.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>'}
];

/* overlay */
function showLoad(){
  hasError=false;
  overlay.classList.remove('gone');
  overlay.style.opacity='1';
  overlay.style.pointerEvents='none';
  errOv.classList.remove('show');
}
function hideOverlay(){
  if(hasError) return;
  overlay.style.opacity='0';
  overlay.style.pointerEvents='none';
  setTimeout(function(){overlay.classList.add('gone');},360);
}
function showErr(title,msg,retry){
  hasError=true;
  overlay.style.opacity='0';
  overlay.style.pointerEvents='none';
  setTimeout(function(){overlay.classList.add('gone');},360);
  document.getElementById('etitle').textContent=title;
  document.getElementById('emsg').textContent=msg||'';
  document.getElementById('eretry').style.display=retry?'flex':'none';
  errOv.classList.add('show');
}

/* buffering spinner */
vid.addEventListener('waiting', function(){ bufspin.style.display='block'; });
vid.addEventListener('playing', function(){ bufspin.style.display='none'; });
vid.addEventListener('canplay', function(){ bufspin.style.display='none'; });

/* center play button */
function syncBig(){
  if(vid.paused){bigplay.classList.add('shown');bigplay.classList.remove('gone');}
  else{bigplay.classList.remove('shown');bigplay.classList.add('gone');}
}
bpbtn.addEventListener('click', function(e){
  e.stopPropagation();
  uPaused=false;
  playerActivated=true;
  vid.play().catch(function(){});
});
vid.addEventListener('play',  syncBig);
vid.addEventListener('pause', syncBig);

/* player area click — first touch = show controls only, second = play/pause */
player.addEventListener('click', function(e){
  if(e.target.closest('#crow')) return;
  if(e.target.closest('.bpbtn')) return;
  if(e.target.closest('#qmenu')) return;
  if(e.target.closest('#social-badges')) return;

  if(!playerActivated){
    playerActivated = true;
    showCtrls();
    return;
  }

  if(e.target === vid || e.target === player){
    if(ctrls.classList.contains('gone')){ showCtrls(); return; }
    togglePlay();
  }
});

/* controls show/hide */
function showCtrls(){
  ctrls.classList.remove('gone');
  clearTimeout(hideTimer);
  if(!vid.paused){
    hideTimer=setTimeout(function(){
      ctrls.classList.add('gone');
    },3200);
  }
}
player.addEventListener('mousemove', showCtrls);
player.addEventListener('touchstart', showCtrls, {passive:true});
showCtrls();

/* play/pause */
function togglePlay(){
  if(vid.paused){ uPaused=false; vid.play().catch(function(){}); }
  else{ uPaused=true; vid.pause(); }
}
bplay.addEventListener('click', function(e){ e.stopPropagation(); togglePlay(); });
function syncPlayIcon(){
  pico.innerHTML=vid.paused
    ?'<path d="M8 5.14v13.72a1 1 0 0 0 1.5.87l11-6.86a1 1 0 0 0 0-1.72L9.5 4.27A1 1 0 0 0 8 5.14z" fill="currentColor"/>'
    :'<rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/>';
}
vid.addEventListener('play',  function(){ syncPlayIcon(); showCtrls(); });
vid.addEventListener('pause', function(){ syncPlayIcon(); showCtrls(); });

/* auto-resume (buffering only, not user pause) */
vid.addEventListener('pause', function(){
  if(!vid.ended && !uPaused){
    setTimeout(function(){ if(vid.paused&&!vid.ended&&!uPaused) vid.play().catch(function(){}); },800);
  }
});
setInterval(function(){ if(vid.paused&&!vid.ended&&!uPaused) vid.play().catch(function(){}); },4000);

/* mute */
bvol.addEventListener('click', function(e){
  e.stopPropagation();
  vid.muted=!vid.muted;
  syncVol();
});
function syncVol(){
  isMuted=vid.muted;
  bvol.classList.toggle('is-muted', isMuted);
  if(isMuted){
    vico.innerHTML='<path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><line x1="16.5" y1="9.5" x2="22.5" y2="15.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><line x1="22.5" y1="9.5" x2="16.5" y2="15.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>';
  } else {
    vico.innerHTML='<path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/><path d="M19 6a9 9 0 0 1 0 12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/>';
  }
}

/* live pill */
livepill.addEventListener('click', function(){
  if(!isLive||!vid.seekable||!vid.seekable.length) return;
  var edge=vid.seekable.end(vid.seekable.length-1);
  vid.currentTime=edge;
  uPaused=false;
  if(vid.paused) vid.play().catch(function(){});
});
setInterval(function(){
  if(!isLive){livepill.style.display='none';return;}
  if(!vid.seekable||!vid.seekable.length) return;
  var edge=vid.seekable.end(vid.seekable.length-1);
  var behind=edge-vid.currentTime>12;
  livepill.style.cursor=behind?'pointer':'default';
  lpitext.textContent=behind?'GO LIVE':'LIVE';
  livepill.style.color=behind?'#ffb020':'#ff5a5a';
  livepill.style.borderColor=behind?'rgba(255,176,32,.32)':'rgba(255,69,69,.32)';
  livepill.style.background=behind?'rgba(255,176,32,.13)':'rgba(255,69,69,.13)';
  var dot=livepill.querySelector('.ldot');
  if(dot) dot.style.background=behind?'#ffb020':'#ff4545';
},2000);

/* progress */
vid.addEventListener('timeupdate', function(){
  if(isDragging) return;
  var p=(vid.duration&&isFinite(vid.duration))?vid.currentTime/vid.duration*100:99.5;
  setP(p);
});
vid.addEventListener('progress', function(){
  if(!vid.buffered.length||!isFinite(vid.duration)) return;
  pbuf.style.width=(vid.buffered.end(vid.buffered.length-1)/vid.duration*100)+'%';
});
vid.addEventListener('loadedmetadata', function(){
  isLive=!isFinite(vid.duration)||vid.duration>86400;
  if(!isLive) livepill.style.display='none';
});
function setP(p){p=Math.max(0,Math.min(100,p));ppl.style.width=p+'%';pth.style.left=p+'%';}
function spct(e){var r=prog.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;return Math.max(0,Math.min(1,x/r.width));}
function applySeek(f){if(!isFinite(vid.duration)) return;vid.currentTime=f*vid.duration;setP(f*100);}
prog.addEventListener('mousedown',  function(e){isDragging=true;prog.classList.add('drag');applySeek(spct(e));});
prog.addEventListener('touchstart', function(e){isDragging=true;prog.classList.add('drag');applySeek(spct(e));},{passive:true});
document.addEventListener('mousemove',  function(e){if(isDragging) applySeek(spct(e));});
document.addEventListener('touchmove',  function(e){if(isDragging){e.preventDefault();applySeek(spct(e));}},{passive:false});
document.addEventListener('mouseup',    function(){if(isDragging){isDragging=false;prog.classList.remove('drag');}});
document.addEventListener('touchend',   function(){if(isDragging){isDragging=false;prog.classList.remove('drag');}});

/* ---------- Quality menu (custom, appears above button) ---------- */
function renderQMenu(){
  var avail = Q_ORDER.filter(function(q){ return qStreams[q]; });
  qlist.innerHTML = '';
  avail.forEach(function(q){
    var row = document.createElement('div');
    row.className = 'qi' + (q===currentQ ? ' active' : '');
    row.innerHTML = '<span>'+q+'</span><span class="qcheck">✓</span>';
    row.addEventListener('click', function(ev){
      ev.stopPropagation();
      closeQMenu();
      if(q !== currentQ) switchQ(q);
    });
    qlist.appendChild(row);
  });
}
function openQMenu(){
  renderQMenu();
  qmenu.classList.add('open');
}
function closeQMenu(){
  qmenu.classList.remove('open');
}

bq.addEventListener('click', function(e){
  e.stopPropagation();
  e.preventDefault();
  if(qmenu.classList.contains('open')){ closeQMenu(); return; }
  openQMenu();
});

document.addEventListener('click', function(e){
  if(!qmenu.classList.contains('open')) return;
  if(qmenu.contains(e.target) || bq.contains(e.target)) return;
  closeQMenu();
});

function switchQ(q){
  if(!qStreams[q]) return;
  currentQ=q; qlbl.textContent=q;
  loadStream(qStreams[q],[]);
}

/* fill / fit / zoom — 3-mode cycle */
function applyFillMode(idx){
  var m=FILL_MODES[idx];
  vid.style.objectFit=m.fit;
  vid.style.transform=m.scale!==1?'scale('+m.scale+')':'none';
  fillico.innerHTML=m.icon;
  bfill.title=m.title;
}
applyFillMode(0);
bfill.addEventListener('click', function(e){
  e.stopPropagation();
  fillModeIdx=(fillModeIdx+1)%FILL_MODES.length;
  applyFillMode(fillModeIdx);
});

/* pip */
if(!document.pictureInPictureEnabled) bpip.style.display='none';
bpip.addEventListener('click', function(e){
  e.stopPropagation();
  if(document.pictureInPictureElement) document.exitPictureInPicture().catch(function(){});
  else vid.requestPictureInPicture().catch(function(){});
});

/* fullscreen + landscape */
bfs.addEventListener('click', function(e){
  e.stopPropagation();
  var inFs=!!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement);
  if(!inFs){
    var p=player;
    var req=p.requestFullscreen||p.webkitRequestFullscreen||p.mozRequestFullScreen;
    if(req){ req.call(p).then(function(){if(screen.orientation&&screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){});}).catch(function(){if(vid.webkitEnterFullscreen) vid.webkitEnterFullscreen();}); }
    else if(vid.webkitEnterFullscreen){ vid.webkitEnterFullscreen(); }
  } else {
    var ex=document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen;
    if(ex) ex.call(document).catch(function(){});
    if(screen.orientation&&screen.orientation.unlock) screen.orientation.unlock();
  }
});
function syncFs(){
  var inFs=!!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement);
  fsico.innerHTML=inFs
    ?'<path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/>'
    :'<path d="M9 4H4v5"/><path d="M15 4h5v5"/><path d="M9 20H4v-5"/><path d="M15 20h5v-5"/>';
}
['fullscreenchange','webkitfullscreenchange','mozfullscreenchange'].forEach(function(e){document.addEventListener(e,syncFs);});

/* Shaka loader */
async function tryShaka(url){
  if(shakaPlayer){try{await shakaPlayer.destroy();}catch(e){}shakaPlayer=null;}
  shakaPlayer=new shaka.Player();
  await shakaPlayer.attach(vid);
  shakaPlayer.configure({streaming:{bufferingGoal:10,rebufferingGoal:2,safeSeekOffset:5,lowLatencyMode:true}});
  shakaPlayer.getNetworkingEngine().registerRequestFilter(function(t,req){req.allowCrossSiteCredentials=true;});
  await shakaPlayer.load(url);
}

async function loadStream(url,fallbacks){
  hasError=false;
  shaka.polyfill.installAll();
  var all=[url].concat((fallbacks||[]).filter(function(u){return u&&u!==url;}));
  var lastErr=null;

  if(shaka.Player.isBrowserSupported()){
    for(var i=0;i<all.length;i++){
      if(!all[i]) continue;
      try{await tryShaka(all[i]);lastErr=null;break;}
      catch(e){
        var hs=(e.data&&e.data[1])?' (HTTP '+e.data[1]+')':'';
        lastErr='Shaka Error '+(e.code||'?')+hs;
        if(shakaPlayer){try{await shakaPlayer.destroy();}catch(x){}shakaPlayer=null;}
      }
    }
  } else {lastErr='unsupported';}

  if(lastErr&&vid.canPlayType('application/vnd.apple.mpegurl')){
    vid.src=all[0]||url; lastErr=null;
  }
  if(lastErr){showErr('Playback Error',lastErr,false);return;}

  vid.muted=true;
  await vid.play().catch(function(){});
  syncVol();

  var onP=function(){vid.removeEventListener('playing',onP);hideOverlay();};
  vid.addEventListener('playing',onP);
  setTimeout(function(){if(!hasError) hideOverlay();},9000);
}

/* JSON */
function fetchJSON(url){
  return new Promise(function(res,rej){
    var x=new XMLHttpRequest();
    x.open('GET',url,true);
    x.timeout=12000;
    x.onreadystatechange=function(){
      if(x.readyState!==4) return;
      if(x.status>=200&&x.status<300){try{res(JSON.parse(x.responseText));}catch(e){rej(new Error('JSON parse error'));}}
      else rej(new Error('HTTP '+x.status));
    };
    x.onerror=function(){rej(new Error('Network error'));};
    x.ontimeout=function(){rej(new Error('Timeout'));};
    x.send();
  });
}

function resolve(data){
  var list=Array.isArray(data)?data:(Array.isArray(data.matches)?data.matches:[]);
  if(!list.length) throw new Error('No matches in JSON');
  var m=null;
  for(var i=0;i<list.length;i++) if(String(list[i].match_id)===String(matchId)){m=list[i];break;}
  if(!m) throw new Error('Match "'+matchId+'" not found ('+list.length+' total)');
  var s=m.streams||{};
  var fb=[s.primary,s.fancode_cdn,s.fancode_lk_cdn,s.fancode_bd_cdn,s.fancode_np_cdn].filter(Boolean);
  if(si===0){
    var as=m.auto_streams||{};
    var keys=Object.keys(as);
    if(!keys.length) throw new Error('No live stream — match not started yet');
    var lang=LANG_MAP[langCode]||m.language||keys[0];
    var al=as[lang]||as[keys[0]];
    if(!al||!al.streams||!Object.keys(al.streams).length) throw new Error('Stream URLs empty for this match');
    return{type:'multi',streams:al.streams,fallbacks:fb};
  }
  var u=si===1?s.fancode_lk_cdn:si===2?s.fancode_np_cdn:si===3?s.fancode_bd_cdn:null;
  if(!u) throw new Error('Regional stream (s='+si+') not available');
  return{type:'single',url:u,fallbacks:fb};
}

/* boot */
(function start(){
  showLoad();
  if(!matchId){showErr('Missing match ID','URL: ?id=MATCHID_LANG&s=0',false);return;}
  fetchJSON(JSON_URL).then(function(data){
    var r;
    try{r=resolve(data);}
    catch(e){showErr('Stream Unavailable',e.message,true);retryTimer=setTimeout(start,8000);return;}
    if(r.type==='multi'){
      qStreams=r.streams;
      var url=r.streams[DEFAULT_Q]||r.streams['720p']||r.streams['480p']||r.streams['1080p']||r.streams['360p']||r.streams['240p'];
      if(!url){showErr('No stream URL','All quality URLs empty for this match',true);return;}
      currentQ=Q_ORDER.find(function(q){return r.streams[q]===url;})||DEFAULT_Q;
      qlbl.textContent=currentQ;
      bq.style.display='';
      loadStream(url,r.fallbacks);
    } else {
      bq.style.display='none';
      loadStream(r.url,r.fallbacks);
    }
  }).catch(function(e){showErr('Could not load data',e.message,true);retryTimer=setTimeout(start,8000);});
})();
})();
</script>

<!-- ====== TELEGRAM POPUP SCRIPT ====== -->
<script>
(function () {
  var tgOverlay = document.getElementById('tgOverlay');

  function closePopup() {
    tgOverlay.classList.remove('show');
  }

  function markSeen() {
    try { sessionStorage.setItem('tgPopupSeen', '1'); } catch (e) {}
  }

  function alreadySeen() {
    try { return sessionStorage.getItem('tgPopupSeen') === '1'; } catch (e) { return false; }
  }

  // Show popup after 3 seconds (only once per session)
  setTimeout(function () {
    if (!alreadySeen()) {
      tgOverlay.classList.add('show');
    }
  }, 3000);

  // Join Now → open Telegram link, then close
  document.getElementById('joinNow').onclick = function () {
    markSeen();
    window.open('https://t.me/sportlink10', '_blank');
    closePopup();
  };

  // Already Joined → just close
  document.getElementById('joinedBtn').onclick = function () {
    markSeen();
    closePopup();
  };

  // Click on dark backdrop → close
  tgOverlay.addEventListener('click', function (e) {
    if (e.target === tgOverlay) {
      closePopup();
    }
  });

  // ESC key → close
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && tgOverlay.classList.contains('show')) {
      closePopup();
    }
  });
})();
</script>
